const normalizarMoneda = (m) => {
  if (!m) return "PESOS";
  const upper = m.toString().toUpperCase().trim();
  if (upper === "ARS" || upper === "PESOS") return "PESOS";
  if (upper === "USD" || upper === "DOLARES" || upper === "DÓLARES" || upper === "DOLARES_BILLETE" || upper === "DÓLARES BILLETE") return "DOLARES";
  return "PESOS";
};

// Helper: formato fecha ISO (YYYY-MM-DD) → DD/MM/YYYY
const formatFechaAR = (fechaISO) => {
  if (!fechaISO) return "";
  const parts = String(fechaISO).split("T")[0].split("-");
  if (parts.length !== 3) return fechaISO;
  return `${parts[2]}/${parts[1]}/${parts[0]}`;
};

const api = {
  get: async (path) => {
    try {
      const r = await fetch(`${API_URL}${path}`, {
        headers:authHeaders({"Cache-Control":"no-cache"}),
        cache:"no-store"
      });
      if (!r.ok) throw new Error(await r.text());
      return await r.json();
    } catch(e) {
      console.error("API GET error:", path, e);
      return null;
    }
  },
  post: async (path, data) => {
    try {
      const r = await fetch(`${API_URL}${path}`, {
        method: "POST",
        headers: authHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify(data)
      });
      if (!r.ok) throw new Error(await r.text());
      return await r.json();

      console.error("API POST error:", path, e);

const SelectorFlechas = ({opciones, value, onChange, label}) => {
  const idx = opciones.findIndex(o => (o.value||o) === value);
  const actual = opciones[idx] || opciones[0];
  const prev = () => onChange((opciones[Math.max(0, idx-1)].value || opciones[Math.max(0, idx-1)]));
  const next = () => onChange((opciones[Math.min(opciones.length-1, idx+1)].value || opciones[Math.min(opciones.length-1, idx+1)]));
  return (
    <div style={{display:"flex",alignItems:"center",gap:0,background:"#0f1117",border:"1px solid #2a2d3e",borderRadius:6,overflow:"hidden"}}>
      <button onClick={prev} disabled={idx===0} style={{
        padding:"8px 12px",background:"transparent",border:"none",
        color:idx===0?"#2a2d3e":"#8890a8",cursor:idx===0?"default":"pointer",
        fontSize:14,borderRight:"1px solid #2a2d3e"
      }}>‹</button>
      <span style={{flex:1,textAlign:"center",padding:"8px 12px",fontSize:13,color:"#e8eaf0",fontWeight:500}}>
        {actual.label || actual}
      </span>
      <button onClick={next} disabled={idx===opciones.length-1} style={{
        padding:"8px 12px",background:"transparent",border:"none",
        color:idx===opciones.length-1?"#2a2d3e":"#8890a8",cursor:idx===opciones.length-1?"default":"pointer",
        fontSize:14,borderLeft:"1px solid #2a2d3e"
      }}>›</button>
    </div>
  );
};

          peso_neto_salida: parseFloat(m.peso_neto_salida_kg) || 0,
          peso_neto_llegada: m.peso_neto_llegada_kg ? parseFloat(m.peso_neto_llegada_kg) : null,
          estado: m.estado,
          estado_liq: m.estado_liquidacion,
          kg_liquidables: m.kg_liquidables ? parseFloat(m.kg_liquidables) : null,
          modalidad: m.modalidad
        }));
        setMovsReal(mapped);
      })
      .catch(()=>setMovsReal(null));
  },[modulo]);
  const enTransito = movs.filter(m=>m.estado==="EN_TRANSITO").length;
  const aLiquidar = movs.filter(m=>m.estado==="DESCARGADO"&&m.estado_liq!=="LIQUIDADO").length;
  return (
    <div className="fade-in">
      <div style={{marginBottom:22}}>
        <h2 style={{fontSize:20,fontWeight:700,marginBottom:4}}>Dashboard — {modulo==="FORMAL"?"Operaciones Formales":"Operaciones Informales"}</h2>
        <p style={{color:"#8890a8",fontSize:13}}>Resumen operativo</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:22}}>
        <StatCard label="Contratos Activos" value={contratos.filter(c=>c.estado!=="CANCELADO").length} sub={`${contratos.filter(c=>c.tipo==="COMPRA").length} compra · ${contratos.filter(c=>c.tipo==="VENTA").length} venta`}/>
        <StatCard label="En Tránsito" value={enTransito} sub="camiones en ruta" color="#3498db"/>
        <StatCard label="A Liquidar" value={aLiquidar} sub="movimientos descargados" color="#27ae60"/>
        <StatCard label="A Fijar" value={contratos.filter(c=>c.tipo_precio==="A_FIJAR").length} sub="contratos sin precio" color="#9b59b6"/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <div className="card">
          <div className="card-header"><span style={{fontWeight:600,fontSize:14}}>Últimos Movimientos</span></div>
          <table><thead><tr><th>N° Mov</th>{modulo==="FORMAL"&&<th>CTG</th>}<th>Especie</th><th>Kg Neto</th><th>Estado</th></tr></thead>
          <tbody>{movs.slice(0,5).map(m=>(
            <tr key={m.id}>
              <td><span className="mono" style={{color:"#f5a623",fontSize:12}}>{m.numero}</span></td>
              {modulo==="FORMAL"&&<td><span className="mono" style={{fontSize:11,color:"#8890a8"}}>{m.nro_ctg||"—"}</span></td>}
              <td>{m.especie}</td>
              <td><span className="mono">{m.peso_neto_llegada?m.peso_neto_llegada.toLocaleString():m.peso_neto_salida.toLocaleString()}</span></td>
              <td><Badge label={m.estado} color={m.estado==="EN_TRANSITO"?"orange":m.estado==="DESCARGADO"?"blue":"green"}/></td>
            </tr>
          ))}</tbody></table>
        </div>
        <div className="card">
          <div className="card-header"><span style={{fontWeight:600,fontSize:14}}>Contratos Abiertos</span></div>
          <table><thead><tr><th>Número</th><th>Tipo</th><th>Especie</th><th>Progreso</th></tr></thead>
          <tbody>{contratos.filter(c=>c.estado!=="CUMPLIDO"&&c.estado!=="CANCELADO").map(c=>(
            <tr key={c.id}>
              <td><span className="mono" style={{color:"#f5a623",fontSize:12}}>{c.numero}</span></td>
              <td><Badge label={c.tipo} color={c.tipo==="COMPRA"?"orange":"blue"}/></td>
              <td>{c.especie}</td>
              <td>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div className="progress-bar" style={{flex:1}}><div className="progress-fill" style={{width:`${(c.asignadas/c.toneladas)*100}%`}}/></div>
                  <span className="mono" style={{fontSize:11,color:"#8890a8",minWidth:60}}>{c.asignadas}/{c.toneladas}tn</span>
                </div>
              </td>
            </tr>
          ))}</tbody></table>
        </div>
      </div>
    </div>
  );
};

// ── CONTRAPARTES ──
const Contrapartes = ({modulo}) => {
  const [showForm,setShowForm]=useState(false);
  const [search,setSearch]=useState("");
  const [lista,setLista]=useState([]);
  const [loading,setLoading]=useState(true);
  const [guardando,setGuardando]=useState(false);
  const [consultandoArca,setConsultandoArca]=useState(false);
  const [form,setForm]=useState({cuit:"",razon_social:"",es_productor:false,es_comprador:false,es_transportista:false,es_corredor:false,condicion_iva:"RI",provincia:"",localidad:"",telefono:"",email:"",domicilio:"",canal_operacion:modulo==="FORMAL"?"FORMAL":"INFORMAL",id_contraparte_relacionada:""});
  const [contrapartesFormales, setContrapartesFormales] = useState([]);
  const [normalizandoCuit, setNormalizandoCuit] = useState(false);

  useEffect(() => {
    if (showForm && modulo === "INFORMAL") {
      api.get("/api/contrapartes?canal=FORMAL")
        .then(data => setContrapartesFormales(Array.isArray(data) ? data : []))
        .catch(e => console.error("Error cargando contrapartes formales:", e));
    }
  }, [showForm, modulo]);

  const consultarCuitEnArca = async () => {
    const cuitLimpio = form.cuit.replace(/[^0-9]/g, '');
    if (cuitLimpio.length !== 11) {
      alert("Por favor, ingresá un CUIT de 11 dígitos");
      return;
    }
    setConsultandoArca(true);
    try {
      const data = await api.get(`/api/contrapartes/consulta-arca/${cuitLimpio}`);
      if (data && data.razon_social) {
        setForm(prev => ({
          ...prev,
          cuit: data.cuit || prev.cuit,
          razon_social: data.razon_social || prev.razon_social,
          condicion_iva: data.condicion_iva || prev.condicion_iva,
          domicilio: data.domicilio || prev.domicilio,
          localidad: data.localidad || prev.localidad,
          provincia: data.provincia || prev.provincia
        }));
        alert("✓ Datos recuperados de ARCA exitosamente");
      }
    } catch (e) {
      console.error(e);
      alert(e.message || "Error al consultar en ARCA. Podés ingresar los datos manualmente.");
    } finally {
      setConsultandoArca(false);
    }
  };

  const cargarContrapartes = async () => {
    setLoading(true);
    try {
      const params = new URLSearchParams();
      if (search) params.append("search",search);
      if (modulo) params.append("canal", modulo);
      const url = `/api/contrapartes?${params.toString()}`;
      const data = await api.get(url);
      setLista(Array.isArray(data) ? data : []);
    } catch(e) {
      console.error("Error:", e);
      setLista([]);
    } finally {
      setLoading(false);
    }
  };

  useEffect(()=>{ cargarContrapartes(); }, [modulo, search]);

  const normalizarCuitRelleno = async () => {
    setNormalizandoCuit(true);
    try {
      const preview = await api.get("/api/contrapartes/normalizar-cuit-relleno/preview");
      if (!preview || preview.total_contrapartes === 0) {
        alert("No hay contrapartes con el CUIT de relleno (99-99999999-9) para normalizar.");
        return;
      }
      let msg = `Se va a asignar un CUIT único ficticio a ${preview.a_normalizar} contraparte(s) que hoy comparten 99-99999999-9, y actualizar sus movimientos históricos para que sigan coincidiendo.`;
      if (preview.nombres_ambiguos.length > 0) {
        msg += `\n\nOJO: ${preview.nombres_ambiguos.length} nombre(s) están repetidos entre dos o más contrapartes y NO se van a tocar (no hay forma de distinguirlas de forma segura):\n${preview.nombres_ambiguos.join(", ")}`;
      }
      msg += "\n\n¿Confirmás?";
      if (!window.confirm(msg)) return;

      const r = await api.post("/api/contrapartes/normalizar-cuit-relleno", {});
      if (r && r.actualizadas !== undefined) {
        alert(`✓ Listo: ${r.actualizadas} contraparte(s) normalizadas, ${r.movimientos_actualizados} movimiento(s) actualizados.${r.ambiguos.length ? "\nSin tocar (nombre ambiguo): " + r.ambiguos.join(", ") : ""}`);
        cargarContrapartes();
      } else {
        alert("Error: " + (r?.error || "no se pudo normalizar"));
      }
    } catch (e) {
      alert("Error: " + (e.response?.data?.error || e.message));
    } finally {
      setNormalizandoCuit(false);
    }
  };

  return (
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:700}}>{modulo==="FORMAL"?"Contrapartes Formales":"Contrapartes Informales"}</h2>
          <p style={{color:"#8890a8",fontSize:13,marginTop:2}}>{modulo==="FORMAL"?"Con CUIT registrado en AFIP":"Identificación interna del sistema"}</p>
        </div>
        <div style={{display:"flex",gap:8}}>
          <Btn variant="secondary" disabled={normalizandoCuit} onClick={normalizarCuitRelleno}>{normalizandoCuit?"Normalizando...":"🔧 Normalizar CUITs de relleno"}</Btn>
          <Btn onClick={()=>setShowForm(true)}>+ Nueva Contraparte</Btn>
        </div>
      </div>
      <div className="card" style={{marginBottom:14}}>
        <div style={{padding:"12px 16px"}}>
          <input placeholder="Buscar por nombre o CUIT..." value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:360}}/>
        </div>
      </div>
      <div className="card">
        <table><thead><tr>
          <th>Código</th><th>CUIT</th><th>Razón Social</th><th>Rubros</th><th>Localidad</th><th>Provincia</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody>
          {loading?(
            <tr><td colSpan={8} style={{textAlign:"center",padding:30,color:"#8890a8"}}>
              <span className="pulse">Cargando...</span>
            </td></tr>
          ):lista.length===0?(
            <tr><td colSpan={8} style={{textAlign:"center",padding:30,color:"#565d7a"}}>
              No hay contrapartes registradas. Usá "+ Nueva Contraparte" para agregar.
            </td></tr>
          ):lista.map(c=>(
            <tr key={c.id}>
              <td><span className="mono" style={{color:"#f5a623",fontSize:12}}>{c.codigo_interno}</span></td>
              <td><span className="mono" style={{fontSize:12}}>{c.cuit||"—"}</span></td>
              <td style={{fontWeight:500}}>{c.razon_social}</td>
              <td>
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {(c.tipo_contraparte==="PRODUCTOR"||c.tipo_contraparte==="AMBOS")&&<Badge label="Productor" color="orange"/>}
                  {(c.tipo_contraparte==="COMPRADOR"||c.tipo_contraparte==="AMBOS")&&<Badge label="Comprador" color="blue"/>}
                  {c.tipo_contraparte==="TRANSPORTISTA"&&<Badge label="Transportista" color="green"/>}
                  {c.tipo_contraparte==="CORREDOR"&&<Badge label="Corredor" color="purple"/>}
                </div>
              </td>
              <td style={{color:"#8890a8",fontSize:12}}>{c.localidad||"—"}</td>
              <td style={{color:"#8890a8",fontSize:12}}>{c.provincia||"—"}</td>
              <td><Badge label={c.activo?"Activo":"Inactivo"} color={c.activo?"green":"gray"}/></td>
              <td style={{display:"flex",gap:6}}>
                <Btn variant="ghost" size="sm" onClick={()=>{
                   setForm({
                     cuit:c.cuit||"",
                     razon_social:c.razon_social||"",
                     es_productor:c.tipo_contraparte==="PRODUCTOR"||c.tipo_contraparte==="AMBOS",
                     es_comprador:c.tipo_contraparte==="COMPRADOR"||c.tipo_contraparte==="AMBOS",
                     es_transportista:c.tipo_contraparte==="TRANSPORTISTA",
                     es_corredor:c.tipo_contraparte==="CORREDOR",
                     condicion_iva:c.condicion_iva||"RI",
                     provincia:c.provincia||"",
                     localidad:c.localidad||"",
                     telefono:c.telefono||"",
                     email:c.email||"",
                     domicilio:c.domicilio||"",
                     _id:c.id,
                     _editando:true,
                   });
                   setShowForm(true);
                }}>Editar</Btn>
                <Btn variant="danger" size="sm" onClick={async()=>{
                  if(!confirm(`¿Eliminar ${c.razon_social}?`)) return;
                  try {
                    await fetch(`/api/contrapartes/${c.id}`, {method:"DELETE",headers:authHeaders()});
                    cargarContrapartes();
                  } catch(e) {
                    alert("Error al eliminar: "+e.message);
                  }
                }}>✕</Btn>
              </td>
            </tr>
          ))
        }</tbody></table>
      </div>
      {showForm&&(
        <Modal title={form._editando?`Editar Contraparte`:`Nueva Contraparte`} onClose={()=>setShowForm(false)} width={860}>
          <div className="form-grid-2">
            <FF label="CUIT" required={modulo === "FORMAL"}>
              <div style={{display:"flex",gap:8}}>
                <input 
                  placeholder="20-12345678-9" 
                  value={form.cuit} 
                  disabled={consultandoArca}
                  onChange={e=>setForm({...form,cuit:e.target.value})}
                  style={{flex:1}}
                />
                <Btn 
                  type="button" 
                  disabled={consultandoArca || !form.cuit} 
                  onClick={consultarCuitEnArca}
                  style={{flexShrink:0,background:"#27ae60",color:"#000",fontWeight:600}}
                >
                  {consultandoArca ? "Consultando..." : "Consultar ARCA"}
                </Btn>
              </div>
            </FF>
            <FF label="Razón Social / Nombre" required><input placeholder="Nombre completo o razón social" value={form.razon_social} onChange={e=>setForm({...form,razon_social:e.target.value})}/></FF>
            <div className="form-field" style={{gridColumn:"span 2"}}>
              <label className="form-label">Rubros <span style={{color:"#f5a623",marginLeft:3}}>*</span></label>
              <div style={{display:"flex",gap:16,padding:"10px 14px",background:"#0f1117",borderRadius:6,border:"1px solid #2a2d3e",flexWrap:"wrap"}}>
                {[
                  {key:"es_productor", label:"Productor / Vendedor", desc:"Nos vende mercadería", color:"#f5a623"},
                  {key:"es_comprador", label:"Comprador", desc:"Le vendemos mercadería", color:"#3498db"},
                  {key:"es_transportista", label:"Transportista", desc:"Hace fletes", color:"#27ae60"},
                  {key:"es_corredor", label:"Corredor", desc:"Interviene en operaciones", color:"#9b59b6"},
                ].map(r=>(
                  <label key={r.key} style={{display:"flex",alignItems:"flex-start",gap:10,cursor:"pointer",padding:"8px 12px",borderRadius:6,border:`1px solid ${form[r.key]?r.color+"44":"#2a2d3e"}`,background:form[r.key]?r.color+"11":"transparent",flex:1,minWidth:150}}>
                    <input
                      type="checkbox"
                      checked={!!form[r.key]}
                      onChange={e=>setForm({...form,[r.key]:e.target.checked})}
                      style={{marginTop:2,accentColor:r.color,width:16,height:16,flexShrink:0}}
                    />
                    <div>
                      <div style={{fontWeight:600,fontSize:13,color:form[r.key]?r.color:"#e8eaf0"}}>{r.label}</div>
                      <div style={{fontSize:11,color:"#8890a8",marginTop:2}}>{r.desc}</div>
                    </div>
                  </label>
                ))}
              </div>
            </div>
            <FF label="Domicilio / Dirección"><input placeholder="Calle, número, piso, depto" value={form.domicilio} onChange={e=>setForm({...form,domicilio:e.target.value})}/></FF>
            <FF label="Condición IVA"><select value={form.condicion_iva} onChange={e=>setForm({...form,condicion_iva:e.target.value})}><option value="RI">Responsable Inscripto</option><option value="MONO">Monotributo</option><option value="EXENTO">Exento</option></select></FF>
            <FF label="Provincia"><select value={form.provincia} onChange={e=>setForm({...form,provincia:e.target.value})}><option value="">Seleccionar...</option>{PROVINCIAS.map(p=><option key={p} value={p}>{p}</option>)}</select></FF>
            <FF label="Localidad"><input placeholder="Ciudad / Localidad" value={form.localidad} onChange={e=>setForm({...form,localidad:e.target.value})}/></FF>
            <FF label="Teléfono"><input placeholder="Teléfono" value={form.telefono} onChange={e=>setForm({...form,telefono:e.target.value})}/></FF>
            <FF label="Email"><input placeholder="correo@ejemplo.com" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}/></FF>
            {modulo === "FORMAL" && (
              <div className="form-field" style={{gridColumn:"span 2", marginTop: 8}}>
                <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
                  <input
                    type="checkbox"
                    checked={form.canal_operacion === 'AMBOS'}
                    onChange={e => setForm({...form, canal_operacion: e.target.checked ? 'AMBOS' : 'FORMAL'})}
                    style={{width:16,height:16}}
                  />
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>Disponible en canal Informal</div>
                    <div style={{fontSize:11,color:"#8890a8",marginTop:2}}>Permite visualizar y utilizar esta contraparte en el canal informal.</div>
                  </div>
                </label>
              </div>
            )}
            {modulo === "INFORMAL" && (
              <FF label="Relacionar con cuenta Formal">
                <select 
                  value={form.id_contraparte_relacionada} 
                  onChange={e => setForm({...form, id_contraparte_relacionada: e.target.value})}
                >
                  <option value="">Sin relación (Cuenta independiente)</option>
                  {contrapartesFormales.map(cf => (
                    <option key={cf.id} value={cf.id}>
                      {cf.razon_social} {cf.cuit ? `(CUIT: ${cf.cuit})` : ''} - {cf.codigo_interno}
                    </option>
                  ))}
                </select>
              </FF>
            )}
          </div>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:8}}>
            <Btn variant="secondary" onClick={()=>setShowForm(false)}>Cancelar</Btn>
            <Btn disabled={guardando} onClick={async()=>{
              if(modulo === "FORMAL" && !form.cuit){alert("El CUIT es obligatorio");return;}
              if(!form.razon_social){alert("La razón social es obligatoria");return;}
              if(!form.es_productor&&!form.es_comprador&&!form.es_transportista&&!form.es_corredor){
                alert("Seleccioná al menos un rubro");return;
              }
              setGuardando(true);
              try {
                const rubros = [];
                if(form.es_productor) rubros.push("PRODUCTOR");
                if(form.es_comprador) rubros.push("COMPRADOR");
                if(form.es_transportista) rubros.push("TRANSPORTISTA");
                if(form.es_corredor) rubros.push("CORREDOR");
                const tipo = rubros.length>1?"AMBOS":rubros[0];
                const datos = {
                  cuit: form.cuit || null,
                  razon_social: form.razon_social,
                  tipo_contraparte: tipo,
                  canal_operacion: form.canal_operacion || (modulo === 'FORMAL' ? 'FORMAL' : 'INFORMAL'),
                  condicion_iva: form.condicion_iva||null,
                  domicilio: form.domicilio||null,
                  localidad: form.localidad||null,
                  provincia: form.provincia||null,
                  telefono: form.telefono||null,
                  email: form.email||null,
                  id_contraparte_relacionada: modulo === 'INFORMAL' && form.id_contraparte_relacionada ? parseInt(form.id_contraparte_relacionada) : null
                };
                if(form._editando && form._id) {
                  await api.put(`/api/contrapartes/${form._id}`, datos);
                  alert("✓ Contraparte actualizada");
                } else {
                  await api.post("/api/contrapartes", datos);
                  alert("✓ Contraparte guardada");
                }
                setShowForm(false);
                setForm({cuit:"",razon_social:"",es_productor:false,es_comprador:false,es_transportista:false,es_corredor:false,condicion_iva:"RI",provincia:"",localidad:"",telefono:"",email:"",domicilio:"",canal_operacion:modulo==="FORMAL"?"FORMAL":"INFORMAL",id_contraparte_relacionada:"",_id:null,_editando:false});
                cargarContrapartes();
              } catch(e) {
                alert("Error: "+e.message);
              } finally {
                setGuardando(false);
              }
            }}>{guardando?"Guardando...":(form._editando?"Actualizar":"Guardar")}</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

                <div>
                  <label style={{fontSize: 11, color: "#8890a8", display: "block", marginBottom: 4}}>Precio Referencia (Pizarra)</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="500000"
                    value={fijacionForm.precio_referencia}
                    onChange={e => {
                      const precio_referencia = e.target.value;
                      const ref = parseFloat(precio_referencia);
                      const desc = parseFloat(fijacionForm.descuento_pct);
                      const precio_fijado = (!isNaN(ref) && !isNaN(desc)) ? (ref*(1-desc/100)).toFixed(2) : fijacionForm.precio_fijado;
                      setFijacionForm({...fijacionForm, precio_referencia, precio_fijado});
                    }}
                    style={{width: "100%", padding: "6px 8px", background: "#1a1d26", border: "1px solid #2a2d3e", color: "#e8eaf0", borderRadius: 4}}
                  />
                </div>
                <div>
                  <label style={{fontSize: 11, color: "#8890a8", display: "block", marginBottom: 4}}>Descuento %</label>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="15"
                    value={fijacionForm.descuento_pct}
                    onChange={e => {
                      const descuento_pct = e.target.value;
                      const ref = parseFloat(fijacionForm.precio_referencia);
                      const desc = parseFloat(descuento_pct);
                      const precio_fijado = (!isNaN(ref) && !isNaN(desc)) ? (ref*(1-desc/100)).toFixed(2) : fijacionForm.precio_fijado;
                      setFijacionForm({...fijacionForm, descuento_pct, precio_fijado});
                    }}
                    style={{width: "100%", padding: "6px 8px", background: "#1a1d26", border: "1px solid #2a2d3e", color: "#e8eaf0", borderRadius: 4}}
                  />
                </div>
                <div>
                  <label style={{fontSize: 11, color: "#8890a8", display: "block", marginBottom: 4}}>Precio Fijado Real ({contratoFijacion.moneda})</label>
                  <input
                    type="number"
                    step="0.01"
                    required
                    placeholder="280000"
                    value={fijacionForm.precio_fijado}
                    onChange={e => {
                      const precio_fijado = e.target.value;
                      const ref = parseFloat(fijacionForm.precio_referencia);
                      const p = parseFloat(precio_fijado);
                      const descuento_pct = (!isNaN(ref) && ref>0 && !isNaN(p)) ? ((1-p/ref)*100).toFixed(2) : fijacionForm.descuento_pct;
                      setFijacionForm({...fijacionForm, precio_fijado, descuento_pct});
                    }}
                    style={{width: "100%", padding: "6px 8px", background: "#1a1d26", border: "1px solid #2a2d3e", color: "#e8eaf0", borderRadius: 4}}
                  />
                </div>
                <div>
                  <label style={{fontSize: 11, color: "#8890a8", display: "block", marginBottom: 4}}>Observaciones</label>
                  <input 
                    type="text" 
                    placeholder="Fijación" 
                    value={fijacionForm.observaciones} 
                    onChange={e => setFijacionForm({...fijacionForm, observaciones: e.target.value})} 
                    style={{width: "100%", padding: "6px 8px", background: "#1a1d26", border: "1px solid #2a2d3e", color: "#e8eaf0", borderRadius: 4}}
                  />
                </div>
                <div style={{gridColumn: "span 2", display: "flex", justifyContent: "flex-end", marginTop: 4}}>
                  <Btn type="submit" size="sm" variant="success">Registrar Fijación</Btn>
                </div>
              </form>
            </div>
            <div>
              <h4 style={{fontSize: 12, color: "#8890a8", marginBottom: 8}}>Historial de Fijaciones</h4>
              <div style={{maxHeight: 180, overflowY: "auto", border: "1px solid #2a2d3e", borderRadius: 6, background: "rgba(0,0,0,0.1)", padding: 6}}>
                {contratoFijacion.fijaciones && contratoFijacion.fijaciones.length > 0 ? (
                  <table style={{width: "100%", fontSize: 11, borderCollapse: "collapse"}}>
                    <thead>
                      <tr style={{borderBottom: "1px solid #2a2d3e", textAlign: "left"}}>
                        <th style={{padding: 4}}>Fecha</th>
                        <th style={{padding: 4}}>Tn</th>
                        <th style={{padding: 4}}>Precio</th>
                        <th style={{padding: 4}}>Desc%</th>
                        <th style={{padding: 4}}>Obs</th>
                        <th style={{padding: 4}}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {contratoFijacion.fijaciones.map(f => (
                        <tr key={f.id} style={{borderBottom: "1px solid rgba(255,255,255,0.02)"}}>
                          <td style={{padding: 4}}>{f.fecha}</td>
                          <td style={{padding: 4}}><span className="mono">{parseFloat(f.cantidad_toneladas).toFixed(3)} tn</span></td>
                          <td style={{padding: 4}}><span className="mono">${parseFloat(f.precio_fijado).toLocaleString()}</span></td>
                          <td style={{padding: 4}}><span className="mono">{f.descuento_pct!=null?`${parseFloat(f.descuento_pct).toFixed(2)}%`:"—"}</span></td>
                          <td style={{padding: 4, color: "#8890a8"}} title={f.observaciones}>{f.observaciones || "—"}</td>
                          <td style={{padding: 4, textAlign: "right"}}>
                            <button 
                              type="button"
                              onClick={() => handleEliminarFijacionModal(f.id)} 
                              style={{background: "none", color: "#e74c3c", border: "none", cursor: "pointer", padding: "2px 4px", fontSize: 13}}
                              title="Eliminar fijación"
                            >
                              🗑️
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                ) : (
                  <div style={{color: "#8890a8", fontSize: 11, textAlign: "center", padding: "20px 0"}}>Aún no hay fijaciones registradas.</div>
                )}
              </div>
              
              {contratoFijacion.fijaciones && contratoFijacion.fijaciones.length > 0 && (() => {
                const totalFixed = contratoFijacion.fijaciones.reduce((acc, f) => acc + parseFloat(f.cantidad_toneladas), 0);
                const remTons = Math.max(0, contratoFijacion.toneladas - totalFixed);
                return (
                  <div style={{fontSize: 11, marginTop: 10, padding: 8, background: "rgba(155, 89, 182, 0.05)", border: "1px solid rgba(155, 89, 182, 0.15)", borderRadius: 6}}>
                    <div style={{display: "flex", justifyContent: "space-between", marginBottom: 2}}>
                      <span>Total Contrato:</span>
                      <strong className="mono">{contratoFijacion.toneladas} tn</strong>
                    </div>
                    <div style={{display: "flex", justifyContent: "space-between", marginBottom: 2}}>
                      <span>Total Fijado:</span>
                      <strong className="mono" style={{color: "#9b59b6"}}>{totalFixed.toFixed(3)} tn</strong>
                    </div>
                    <div style={{display: "flex", justifyContent: "space-between", marginBottom: 2}}>
                      <span>Pendiente de Fijar:</span>
                      <strong className="mono" style={{color: remTons > 0 ? "#f5a623" : "#2ecc71"}}>{remTons.toFixed(3)} tn</strong>
                    </div>
                    <div style={{display: "flex", justifyContent: "space-between", borderTop: "1px solid rgba(155, 89, 182, 0.2)", paddingTop: 4, marginTop: 4}}>
                      <span>Precio Ponderado Fijado:</span>
                      <strong className="mono" style={{color: "#2ecc71"}}>${(contratoFijacion.precio_fijado || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} {contratoFijacion.moneda}</strong>
                    </div>
                  </div>
                );
              })()}
            </div>
          </div>
          <div style={{display: "flex", justifyContent: "flex-end", marginTop: 20}}>
            <Btn variant="secondary" onClick={() => setContratoFijacion(null)}>Cerrar</Btn>
          </div>
        </Modal>
      )}

    </div>
  );
};

// ── ASIGNAR MERCADERÍA (bolsa por zona, desde el lado del productor/contrato) ──
// Arranca eligiendo productor + especie/campaña en vez de arrancar por
// zona: muestra cuanto tiene ESE productor puntual sin aplicar en cada
// zona (nunca mezclado con lo de otro productor) y sus contratos de
// compra abiertos, para ir completando contrato por contrato sin tener
// que ir camion por camion.
const AsignarMercaderia = ({modulo, contrapartes, especies, campanas, onAplicado}) => {
  const [idProductor, setIdProductor] = useState("");
  const [idEspecie, setIdEspecie] = useState("");
  const [idCampana, setIdCampana] = useState("");
  const [zonas, setZonas] = useState(null);
  const [contratosProductor, setContratosProductor] = useState([]);
  const [cargando, setCargando] = useState(false);

  const [aplicando, setAplicando] = useState(null); // zona siendo aplicada
  const [contratoSel, setContratoSel] = useState("");
  const [toneladasSel, setToneladasSel] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [camionesDisponibles, setCamionesDisponibles] = useState([]);
  const [cargandoCamiones, setCargandoCamiones] = useState(false);

  const productores = contrapartes.filter(c => c.tipo_contraparte === "PRODUCTOR" || c.tipo_contraparte === "AMBOS" || c.tipo === "PRODUCTOR" || c.tipo === "AMBOS");

  const buscar = async () => {
    if (!idProductor || !idEspecie || !idCampana) { setZonas(null); return; }
    setCargando(true);
    try {
      const [z, ctrs] = await Promise.all([
        api.get(`/api/stock/productor/${idProductor}/por-zona?id_especie=${idEspecie}&id_campana=${idCampana}`),
        api.get(`/api/contratos?modalidad=${modulo}&tipo=COMPRA&vista=todos`)
      ]);
      setZonas(z || []);
      const idProdInt = parseInt(idProductor);
      setContratosProductor((ctrs || []).filter(c =>
        !c.es_canje && c.id_contraparte === idProdInt && c.id_especie === parseInt(idEspecie) &&
        c.id_campana === parseInt(idCampana) && c.estado !== "CUMPLIDO"
      ));
    } catch(e) { alert("Error al buscar: " + e.message); }
    finally { setCargando(false); }
  };

  useEffect(() => { buscar(); }, [idProductor, idEspecie, idCampana]);

  const fmtTn = (v) => `${Number(v).toLocaleString("es-AR",{minimumFractionDigits:3,maximumFractionDigits:3})} tn`;

  const abrirAplicar = async (zona) => {
    setAplicando(zona);
    setContratoSel("");
    setToneladasSel("");
    setCamionesDisponibles([]);
    setCargandoCamiones(true);
    try {
      const camiones = await api.get(`/api/stock/por-zona/${encodeURIComponent(zona)}/camiones?id_especie=${idEspecie}&id_campana=${idCampana}&id_contraparte=${idProductor}`);
      setCamionesDisponibles(camiones || []);
    } catch(e) { /* solo es la vista previa, se puede seguir igual */ }
    finally { setCargandoCamiones(false); }
  };

  const aplicar = async (zona) => {
    if (!contratoSel || !toneladasSel) { alert("Elegí el contrato y las toneladas"); return; }
    setGuardando(true);
    try {
      const r = await api.post(`/api/contratos/${contratoSel}/aplicar-stock-zona`, {
        zona, toneladas: parseFloat(toneladasSel), id_contraparte_productor: parseInt(idProductor)
      });
      if (r && r.aplicacion) {
        const detalleCamiones = (r.camiones||[]).map(c=>`${c.numero_movimiento}: ${(c.kg/1000).toFixed(3)}tn`).join("\n");
        alert(`✓ Aplicadas ${r.aplicacion.toneladas}tn al contrato, tomadas de ${(r.camiones||[]).length} camión(es):\n${detalleCamiones}`);
        setAplicando(null);
        buscar();
        if (onAplicado) onAplicado();
      } else {
        alert("Error: " + (r?.error || "no se pudo aplicar"));
      }
    } catch(e) { alert("Error: " + (e.response?.data?.error || e.message)); }
    finally { setGuardando(false); }
  };

  return (
    <div className="card">
      <div style={{padding:"14px 18px",borderBottom:"1px solid #2a2d3e"}}>
        <p style={{fontSize:12,color:"#8890a8",margin:0}}>
          Elegí el productor y el producto: vas a ver cuánto tiene entregado y sin asignar en cada zona (solo lo de él, no se mezcla con lo de otros productores en la misma zona), y sus contratos de compra pendientes para ir aplicando.
        </p>
        <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:12}}>
          <FF label="Productor">
            <select value={idProductor} onChange={e=>setIdProductor(e.target.value)}>
              <option value="">Seleccionar...</option>
              {productores.map(p=><option key={p.id} value={p.id}>{p.razon_social}{p.cuit?" — "+p.cuit:""}</option>)}
            </select>
          </FF>
          <FF label="Cultivo">
            <select value={idEspecie} onChange={e=>setIdEspecie(e.target.value)}>
              <option value="">Seleccionar...</option>
              {especies.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select>
          </FF>
          <FF label="Campaña">
            <select value={idCampana} onChange={e=>setIdCampana(e.target.value)}>
              <option value="">Seleccionar...</option>
              {campanas.map(c=><option key={c.id} value={c.id}>{c.descripcion}</option>)}
            </select>
          </FF>
        </div>
      </div>

      {!idProductor || !idEspecie || !idCampana ? (
        <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>Elegí productor, cultivo y campaña para ver su stock por zona.</div>
      ) : cargando ? (
        <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>Cargando...</div>
      ) : (
        <>
          <div style={{padding:"12px 18px 4px",fontSize:11,color:"#8890a8",textTransform:"uppercase",letterSpacing:".06em"}}>Toneladas sin asignar de este productor, por zona</div>
          {(!zonas || zonas.length===0) ? (
            <div style={{padding:"10px 18px 20px",color:"#8890a8",fontSize:13}}>Este productor no tiene camiones descargados sin aplicar de este producto/campaña.</div>
          ) : (
            <table><thead><tr><th>Zona</th><th>Toneladas disponibles</th><th></th></tr></thead>
            <tbody>
              {zonas.map(z=>(
                <React.Fragment key={z.zona}>
                  <tr>
                    <td style={{fontWeight:600}}>{z.zona}</td>
                    <td className="mono">{fmtTn(z.toneladas_disponible)}</td>
                    <td><Btn size="sm" variant="secondary" onClick={()=>abrirAplicar(z.zona)}>Aplicar a contrato</Btn></td>
                  </tr>
                  {aplicando===z.zona && (
                    <tr>
                      <td colSpan={3} style={{padding:"10px 16px",background:"#0f1117"}}>
                        {contratosProductor.length===0 ? (
                          <div style={{fontSize:12,color:"#8890a8"}}>Este productor no tiene contratos de compra pendientes en {modulo.toLowerCase()} para este cultivo/campaña.</div>
                        ) : (
                          <div style={{display:"flex",gap:8,alignItems:"end",flexWrap:"wrap"}}>
                            <FF label="Contrato de compra">
                              <select value={contratoSel} onChange={e=>setContratoSel(e.target.value)}>
                                <option value="">Seleccionar...</option>
                                {contratosProductor.map(c=>(
                                  <option key={c.id} value={c.id}>{c.numero_contrato} — faltan {(parseFloat(c.cantidad_toneladas_pactadas)-parseFloat(c.cantidad_toneladas_asignadas||0)).toFixed(3)}tn</option>
                                ))}
                              </select>
                            </FF>
                            <FF label="Toneladas a aplicar"><input type="number" value={toneladasSel} onChange={e=>setToneladasSel(e.target.value)} placeholder={`máx ${z.toneladas_disponible}`}/></FF>
                            <Btn size="sm" disabled={guardando} onClick={()=>aplicar(z.zona)}>{guardando?"Aplicando...":"Confirmar"}</Btn>
                            <Btn size="sm" variant="ghost" onClick={()=>setAplicando(null)}>Cancelar</Btn>
                          </div>
                        )}
                        <div style={{marginTop:10}}>
                          <div style={{fontSize:11,color:"#8890a8",marginBottom:4}}>Camiones de este productor en esta zona (se toman enteros por orden de llegada; el último se parte si hace falta):</div>
                          {cargandoCamiones ? <div style={{fontSize:12,color:"#8890a8"}}>Cargando...</div> : camionesDisponibles.length===0 ? (
                            <div style={{fontSize:12,color:"#8890a8"}}>No hay camiones descargados disponibles.</div>
                          ) : (
                            <table style={{width:"100%",fontSize:11}}>
                              <thead><tr><th>Movimiento</th><th>Fecha descarga</th><th>Kg disponibles</th><th>Ubicación</th></tr></thead>
                              <tbody>
                                {camionesDisponibles.map(c=>(
                                  <tr key={c.id}>
                                    <td className="mono">{c.numero_movimiento}</td>
                                    <td>{c.fecha_descarga ? formatFechaAR(c.fecha_descarga) : "—"}</td>
                                    <td className="mono">{Number(c.kg_disponible).toLocaleString("es-AR",{maximumFractionDigits:0})}</td>
                                    <td>{c.ubicacion_destino_nombre}</td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          )}
                        </div>
                      </td>
                    </tr>
                  )}
                </React.Fragment>
              ))}
            </tbody></table>
          )}

          <div style={{padding:"12px 18px 4px",fontSize:11,color:"#8890a8",textTransform:"uppercase",letterSpacing:".06em"}}>Contratos de compra pendientes de este productor</div>
          {contratosProductor.length===0 ? (
            <div style={{padding:"10px 18px 20px",color:"#8890a8",fontSize:13}}>No tiene contratos de compra pendientes para este cultivo/campaña en {modulo.toLowerCase()}.</div>
          ) : (
            <table><thead><tr><th>Número</th><th>Tn pactadas</th><th>Tn asignadas</th><th>Faltan</th><th>Estado</th></tr></thead>
            <tbody>
              {contratosProductor.map(c=>(
                <tr key={c.id}>
                  <td className="mono">{c.numero_contrato}</td>
                  <td className="mono">{fmtTn(c.cantidad_toneladas_pactadas)}</td>
                  <td className="mono">{fmtTn(c.cantidad_toneladas_asignadas||0)}</td>
                  <td className="mono">{fmtTn(parseFloat(c.cantidad_toneladas_pactadas)-parseFloat(c.cantidad_toneladas_asignadas||0))}</td>
                  <td><Badge label={c.estado} color={c.estado==="EN_CURSO"?"blue":"gray"}/></td>
                </tr>
              ))}
            </tbody></table>
          )}
        </>
      )}
    </div>
  );
};

// ── ASIGNACIÓN DE MOVIMIENTOS A CONTRATOS ──
// Un movimiento puede necesitar repartirse entre mas de un contrato del
// mismo lado: el productor entrego de mas (dos contratos de compra) o el
// comprador recibio de mas (dos contratos de venta). El contrato "principal"
// se sigue asignando como siempre (al cargar el movimiento, o en su ficha);
// esta pantalla es solo para el remanente que todavia no tiene destino, de
// cada lado por separado. No tiene nada que ver con la Bolsa por Zona.
const AsignacionMovimientos = ({modulo}) => {
  const [lado, setLado] = useState("COMPRA");
  const [pendientes, setPendientes] = useState([]);
  const [contratosDisponibles, setContratosDisponibles] = useState([]);
  const [cargando, setCargando] = useState(true);

  const [asignando, setAsignando] = useState(null); // id de movimiento
  const [contratoSel, setContratoSel] = useState("");
  const [kgSel, setKgSel] = useState("");
  const [guardando, setGuardando] = useState(false);

  const cargar = async () => {
    setCargando(true);
    try {
      const [pend, ctrs] = await Promise.all([
        api.get(`/api/movimientos/pendientes-asignacion?tipo=${lado}&modalidad=${modulo}`),
        api.get(`/api/contratos?modalidad=${modulo}&tipo=${lado}&vista=todos`)
      ]);
      setPendientes(pend || []);
      setContratosDisponibles((ctrs || []).filter(c => !c.es_canje && c.estado !== "CUMPLIDO"));
    } catch(e) { alert("Error al cargar: " + e.message); }
    finally { setCargando(false); }
  };

  useEffect(() => { cargar(); }, [lado, modulo]);

  const fmtKg = (v) => `${Number(v).toLocaleString("es-AR",{maximumFractionDigits:0})} kg`;

  // Mismo criterio "soft" que ya se usa al cargar un movimiento: misma
  // especie, y si hay nombre de contraparte, que se parezcan. La campaña NO
  // se filtra aca -- se muestra igual pero marcada, porque en la practica la
  // mayoria de "sin contrato" son en realidad contratos de otra campaña
  // (el papeleo suele ir atrasado respecto de lo que ya se entregó).
  const candidatosPara = (mov) => contratosDisponibles.filter(c => {
    if (c.id_especie !== mov.id_especie) return false;
    const nombreMov = (mov.contraparte_nombre || "").toLowerCase().trim();
    if (!nombreMov) return true;
    const nombreCtr = (c.contraparte_nombre || "").toLowerCase().trim();
    return nombreCtr.includes(nombreMov) || nombreMov.includes(nombreCtr);
  });

  const abrirAsignar = (mov) => {
    setAsignando(mov.id);
    setContratoSel("");
    setKgSel(mov.kg_pendiente.toFixed(3));
  };

  const asignar = async (mov) => {
    if (!contratoSel || !kgSel || parseFloat(kgSel) <= 0) { alert("Elegí el contrato y los kg"); return; }
    const contrato = contratosDisponibles.find(c => c.id === parseInt(contratoSel));
    const otraCampana = contrato && contrato.id_campana !== mov.id_campana;
    if (otraCampana) {
      if (modulo === "FORMAL") {
        alert(`Este contrato es de la campaña ${contrato.campana_desc}, pero el movimiento es de ${mov.campana_desc}. En Formal la campaña tiene que coincidir exactamente — no se puede asignar.`);
        return;
      }
      if (!window.confirm(`Este contrato es de la campaña ${contrato.campana_desc}, pero el movimiento es de ${mov.campana_desc}. ¿Confirmás igual?`)) return;
    }
    setGuardando(true);
    try {
      const r = await api.post(`/api/movimientos/${mov.id}/asignar-extra`, {
        tipo_contrato: lado, id_contrato: parseInt(contratoSel), kg_aplicados: parseFloat(kgSel)
      });
      if (r && r.id) {
        alert("✓ Asignado correctamente");
        setAsignando(null);
        cargar();
      } else {
        alert("Error: " + (r?.error || "no se pudo asignar"));
      }
    } catch(e) { alert("Error: " + (e.response?.data?.error || e.message)); }
    finally { setGuardando(false); }
  };

  return (
    <div className="card">
      <div style={{padding:"14px 18px",borderBottom:"1px solid #2a2d3e"}}>
        <p style={{fontSize:12,color:"#8890a8",margin:0,marginBottom:10}}>
          Movimientos ya descargados con kilos todavía sin repartir en algún contrato de este lado — porque el {lado==="COMPRA"?"productor entregó":"comprador recibió"} de más, o porque al cargar no había (o había más de uno) contrato para elegir. El contrato principal del movimiento no se toca acá.
        </p>
        <div style={{display:"flex",border:"1px solid #2a2d3e",borderRadius:6,overflow:"hidden",width:"fit-content"}}>
          {[["COMPRA","Lado Compra (productor)"],["VENTA","Lado Venta (comprador)"]].map(([v,label])=>(
            <button key={v} onClick={()=>setLado(v)} style={{

// ── MOVIMIENTOS ──
// ── VINCULACIÓN FORMAL / INFORMAL ──
// El "gemelo" automatico (un Informal con CPE genera su par Formal solo)
// unicamente se dispara al CREAR el movimiento con el CPE ya cargado en ese
// momento -- si el CPE se agrega despues editando, o el par ya existia de
// antes por otro medio, nunca quedan enganchados. Esta pantalla busca por
// CTG y/o patente en TODA la base (las dos modalidades) para engancharlos
// a mano cuando corresponda.
const VinculacionMovimientos = ({modulo, onVolver}) => {
  const [nroCtg, setNroCtg] = useState("");
  const [patente, setPatente] = useState("");
  const [resultados, setResultados] = useState(null);
  const [buscando, setBuscando] = useState(false);
  const [seleccionados, setSeleccionados] = useState([]);
  const [vinculando, setVinculando] = useState(false);

  const buscar = async () => {
    if (!nroCtg.trim() && !patente.trim()) { alert("Ingresá al menos CTG o patente"); return; }
    setBuscando(true);
    setSeleccionados([]);
    try {
      const params = [];
      if (nroCtg.trim()) params.push(`nro_ctg=${encodeURIComponent(nroCtg.trim())}`);
      if (patente.trim()) params.push(`patente=${encodeURIComponent(patente.trim())}`);
      const r = await api.get(`/api/movimientos/buscar-vinculo?${params.join("&")}`);
      setResultados(r || []);
    } catch(e) { alert("Error al buscar: " + e.message); }
    finally { setBuscando(false); }
  };

  const toggleSeleccion = (m) => {
    if (m.id_movimiento_vinculado) return; // ya esta vinculado, no se toca desde aca
    setSeleccionados(prev => {
      if (prev.includes(m.id)) return prev.filter(id => id !== m.id);
      if (prev.length >= 2) return prev; // maximo dos
      return [...prev, m.id];
    });
  };

  const seleccionadosObjs = (resultados || []).filter(m => seleccionados.includes(m.id));
  const puedeVincular = seleccionadosObjs.length === 2 && seleccionadosObjs[0].modalidad !== seleccionadosObjs[1].modalidad;

  const vincular = async () => {
    if (!puedeVincular) return;
    setVinculando(true);
    try {
      const r = await api.put(`/api/movimientos/${seleccionadosObjs[0].id}/vincular`, { id_par: seleccionadosObjs[1].id });
      if (r && r.ok) {
        alert(`✓ ${seleccionadosObjs[0].numero_movimiento} vinculado con ${seleccionadosObjs[1].numero_movimiento}`);
        buscar();
      } else {
        alert("Error: " + (r?.error || "no se pudo vincular"));
      }
    } catch(e) { alert("Error: " + (e.response?.data?.error || e.message)); }
    finally { setVinculando(false); }
  };

  return (
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
        <Btn variant="ghost" size="sm" onClick={onVolver}>← Volver a Movimientos</Btn>
        <h2 style={{fontSize:18,fontWeight:700}}>Vinculación Formal / Informal</h2>
      </div>
      <div className="card" style={{marginBottom:16,padding:"14px 18px"}}>
        <p style={{fontSize:12,color:"#8890a8",margin:0,marginBottom:12}}>
          Cuando un camión se cargó por separado del lado Formal y del lado Informal (no se enganchó solo al crearlo), buscalo acá por CTG y/o patente — te muestra los movimientos que coincidan de cualquiera de los dos lados, y podés elegir uno Formal y uno Informal para vincularlos.
        </p>
        <div style={{display:"flex",gap:8,alignItems:"end",flexWrap:"wrap"}}>
          <FF label="N° CTG"><input value={nroCtg} onChange={e=>setNroCtg(e.target.value)} placeholder="Ej: 10133308605" onKeyDown={e=>e.key==="Enter"&&buscar()}/></FF>
          <FF label="Patente"><input value={patente} onChange={e=>setPatente(e.target.value)} placeholder="Ej: KGJ082" onKeyDown={e=>e.key==="Enter"&&buscar()}/></FF>
          <Btn disabled={buscando} onClick={buscar}>{buscando?"Buscando...":"Buscar"}</Btn>
        </div>
      </div>

      {resultados !== null && (
        <div className="card">
          {resultados.length === 0 ? (
            <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>No se encontraron movimientos con ese CTG/patente.</div>
          ) : (
            <>
              <table>
                <thead><tr>
                  <th></th><th>Movimiento</th><th>Modalidad</th><th>Estado</th><th>CTG</th><th>Patente</th>
                  <th>Productor</th><th>Comprador</th><th>Vinculado con</th>
                </tr></thead>
                <tbody>
                  {resultados.map(m=>(
                    <tr key={m.id} style={m.id_movimiento_vinculado ? {opacity:0.5} : {}}>
                      <td>
                        {!m.id_movimiento_vinculado && (
                          <input type="checkbox" checked={seleccionados.includes(m.id)} onChange={()=>toggleSeleccion(m)}
                            disabled={!seleccionados.includes(m.id) && seleccionados.length>=2}/>
                        )}
                      </td>
                      <td className="mono">{m.numero_movimiento}</td>
                      <td><Badge label={m.modalidad} color={m.modalidad==="FORMAL"?"blue":"orange"}/></td>
                      <td>{m.estado}</td>
                      <td className="mono">{m.nro_ctg || "—"}</td>
                      <td className="mono">{m.patente_chasis || "—"}</td>
                      <td>{m.productor_nombre || "—"}</td>
                      <td>{m.destinatario_nombre || "—"}</td>
                      <td>{m.vinculado_a_numero || (m.id_movimiento_vinculado ? "—" : "")}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:12,color:"#8890a8"}}>
                  {seleccionados.length===0 && "Elegí un movimiento Formal y uno Informal para vincularlos."}
                  {seleccionados.length===1 && "Falta elegir el segundo."}
                  {seleccionados.length===2 && !puedeVincular && "Los dos elegidos son de la misma modalidad — elegí uno Formal y uno Informal."}
                </span>
                <Btn disabled={!puedeVincular || vinculando} onClick={vincular}>{vinculando?"Vinculando...":"🔗 Vincular seleccionados"}</Btn>
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
};

// ── REPORTES DE DESCARGA (desde la app móvil) ──
// Llegan con foto de ticket + contraparte/comprador/observaciones desde el
// celu, sin pasar todavía por ningún control. Acá se revisan uno por uno:
// "Completar" abre el alta normal de Movimiento con esos datos precargados
// (y la foto al lado para mirar); recién cuando se guarda el movimiento se
// borra este reporte (foto incluida) — no se conservan a largo plazo.
const ReportesDescarga = ({onVolver, onCompletar}) => {
  const [reportes, setReportes] = useState(null);
  const [cargando, setCargando] = useState(true);
  const [abiertoId, setAbiertoId] = useState(null);
  const [fotoAbierta, setFotoAbierta] = useState(null);
  const [cargandoFoto, setCargandoFoto] = useState(false);

  const cargar = async () => {
    setCargando(true);
    try {
      const r = await api.get("/api/reportes-descarga");
      setReportes(r || []);
    } catch(e) { alert("Error al cargar: " + e.message); }
    finally { setCargando(false); }
  };
  useEffect(()=>{ cargar(); }, []);

  const toggleAbierto = async (r) => {
    if (abiertoId === r.id) { setAbiertoId(null); setFotoAbierta(null); return; }
    setAbiertoId(r.id);
    setFotoAbierta(null);
    setCargandoFoto(true);
    try {
      const detalle = await api.get(`/api/reportes-descarga/${r.id}`);
      setFotoAbierta(detalle?.foto_base64 || null);
    } catch(e) { /* si falla, se puede completar igual sin ver la foto */ }
    finally { setCargandoFoto(false); }
  };

  const descartar = async (r) => {
    if (!window.confirm(`¿Descartar este reporte sin crear un movimiento? Se borra la foto y no se puede deshacer.`)) return;
    try {
      await api.delete(`/api/reportes-descarga/${r.id}`);
      cargar();
    } catch(e) { alert("Error: " + e.message); }
  };

  return (
    <div className="fade-in">
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
        <Btn variant="ghost" size="sm" onClick={onVolver}>← Volver a Movimientos</Btn>
        <h2 style={{fontSize:18,fontWeight:700}}>Reportes de descarga pendientes</h2>
      </div>
      <div className="card" style={{marginBottom:16,padding:"14px 18px"}}>
        <p style={{fontSize:12,color:"#8890a8",margin:0}}>
          Lo que mandan desde la app del celu (foto del ticket + comprador + contraparte + observaciones). "Completar" abre el alta de movimiento con estos datos ya cargados — elegís Formal/Informal, revisás la foto y completás el resto. Al guardar, este reporte se borra solo.
        </p>
      </div>

      {cargando ? (
        <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>Cargando...</div>
      ) : (reportes && reportes.length === 0) ? (
        <div className="card" style={{padding:40,textAlign:"center",color:"#8890a8"}}>No hay reportes pendientes.</div>
      ) : (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {(reportes||[]).map(r=>(
            <div className="card" key={r.id} style={{padding:0,overflow:"hidden"}}>
              <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap",cursor:"pointer"}} onClick={()=>toggleAbierto(r)}>
                <div style={{flex:1,minWidth:200}}>
                  <div style={{fontWeight:600}}>{r.contraparte_texto || "(sin contraparte)"}</div>
                  <div style={{fontSize:12,color:"#8890a8"}}>
                    Comprador: {r.comprador_nombre || "—"} · Patente: {r.patente_chasis || "—"} · {new Date(r.created_at).toLocaleString("es-AR")}
                  </div>
                  {r.lugar_descarga_sugerido && <div style={{fontSize:12,color:"#8890a8"}}>Lugar sugerido: {r.lugar_descarga_sugerido}</div>}
                  {r.observaciones && <div style={{fontSize:12,color:"#8890a8",fontStyle:"italic"}}>"{r.observaciones}"</div>}
                </div>
                <div style={{fontSize:12,color:"#8890a8"}}>{r.usuario||"—"}</div>
                <Btn size="sm" onClick={(e)=>{e.stopPropagation();onCompletar(r);}}>Completar →</Btn>
                <Btn size="sm" variant="danger" onClick={(e)=>{e.stopPropagation();descartar(r);}}>Descartar</Btn>
              </div>
              {abiertoId === r.id && (
                <div style={{padding:"0 16px 16px",borderTop:"1px solid #2a2d3e"}}>
                  {cargandoFoto ? (
                    <div style={{padding:20,textAlign:"center",color:"#8890a8"}}>Cargando foto...</div>
                  ) : fotoAbierta ? (
                    <img src={fotoAbierta} style={{maxWidth:"100%",maxHeight:500,borderRadius:8,marginTop:12}}/>
                  ) : (
                    <div style={{padding:20,textAlign:"center",color:"#8890a8"}}>No se pudo cargar la foto.</div>
                  )}
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

const Movimientos = ({modulo, usuario, globalFiltroProductor, globalFiltroEspecie, setGlobalFiltroProductor, setGlobalFiltroEspecie, setSec}) => {
  const [subTab,setSubTab]=useState("lista");
  const [completandoReporteId,setCompletandoReporteId]=useState(null);
  const [reportesPendientesCount,setReportesPendientesCount]=useState(0);
  useEffect(()=>{
    api.get("/api/reportes-descarga").then(d=>setReportesPendientesCount((d||[]).length)).catch(()=>{});
  },[subTab]);
  const [showForm,setShowForm]=useState(false);
  const [showImport,setShowImport]=useState(false);
  const [showRapido,setShowRapido]=useState(false);
  const [selected,setSelected]=useState(null);
  const [tab,setTab]=useState("salida");
  const [importing,setImporting]=useState(false);
  const [importResult,setImportResult]=useState(null);
  const [importContratoCompra, setImportContratoCompra] = useState("");
  const [importContratoVenta, setImportContratoVenta] = useState("");
  const [importTarifaFleteReal, setImportTarifaFleteReal] = useState("");
  const [importHumedadSalida, setImportHumedadSalida] = useState("");
  const [showImportTicket, setShowImportTicket] = useState(false);
  const [ticketContratoCompra, setTicketContratoCompra] = useState("");
  const [ticketContratoVenta, setTicketContratoVenta] = useState("");
  const [ticketResult, setTicketResult] = useState(null);
  const [calidadParametros, setCalidadParametros] = useState([]);
  const [calidadModo, setCalidadModo] = useState("RUBROS"); // "RUBROS" or "FACTOR"
  const [importingTicket, setImportingTicket] = useState(false);
  const [mappings, setMappings] = useState([]);
  const [ticketFileUrl, setTicketFileUrl] = useState(null);
  const [uploadedTicketFile, setUploadedTicketFile] = useState(null);
  const [showImportExcel, setShowImportExcel] = useState(false);
  const [excelRows, setExcelRows] = useState([]);
  const [importingExcel, setImportingExcel] = useState(false);
  const [excelFileName, setExcelFileName] = useState("");
  const [movsReal,setMovsReal]=useState(null);
  const [vista,setVista]=useState("recientes");

  let rawMovs = movsReal !== null ? movsReal : mockMovimientos.filter(m=>m.modalidad===modulo);
  if (globalFiltroProductor) {
    rawMovs = rawMovs.filter(m => 
      (m.remitente_comercial_productor_nombre || m.titular_cpe_nombre || m.productor || "").toLowerCase().includes(globalFiltroProductor.toLowerCase()) ||
      (m.destinatario_nombre || m.comprador || "").toLowerCase().includes(globalFiltroProductor.toLowerCase())
    );
  }
  if (globalFiltroEspecie) {
    rawMovs = rawMovs.filter(m => 
      (m.especie_nombre || m.especie || "").toLowerCase().includes(globalFiltroEspecie.toLowerCase())
    );
  }
  const movs = [...rawMovs].sort((a, b) => {
    const isAPending = a.estado === "BORRADOR" || a.estado === "EN_TRANSITO" || !a.peso_tara_salida || (a.estado === "DESCARGADO" && a.factor === null);
    const isBPending = b.estado === "BORRADOR" || b.estado === "EN_TRANSITO" || !b.peso_tara_salida || (b.estado === "DESCARGADO" && b.factor === null);
    if (isAPending && !isBPending) return -1;
    if (!isAPending && isBPending) return 1;
    return new Date(b.created_at || 0) - new Date(a.created_at || 0);
  });
  const tienePendientesViejos = movs.some(m => {
    const isPending = m.estado === "BORRADOR" || m.estado === "EN_TRANSITO" || !m.peso_tara_salida || (m.estado === "DESCARGADO" && m.factor === null);
    if (!isPending) return false;
    const creado = new Date(m.created_at || 0).getTime();
    return (Date.now() - creado) > 24 * 60 * 60 * 1000;
  });
  const [contratosReal,setContratosReal]=useState(null);
  const contratos = contratosReal !== null ? contratosReal : mockContratos.filter(c=>c.modalidad===modulo);
  const [contrapartesReal, setContrapartesReal] = useState(null);
  const contrapartes = (contrapartesReal !== null ? contrapartesReal : mockContrapartes).map(c => ({
    ...c,
    tipo: c.tipo_contraparte || c.tipo,
    tipo_contraparte: c.tipo_contraparte || c.tipo,
    codigo: c.codigo_interno || c.codigo,
    codigo_interno: c.codigo_interno || c.codigo
  }));
  const [tempFactor, setTempFactor] = useState(null);
  const [calidadTipoAjuste, setCalidadTipoAjuste] = useState("FACTOR");
  const [calidadValorAjuste, setCalidadValorAjuste] = useState(null);

  const calcularKilosALiquidar = (pesoNetoLlegada, humedad, tipoAjuste, valorAjuste, factorManualFallback, factorCalculadoFallback) => {
    const humPct = getMermaHumedadPct(movForm.id_especie, humedad !== null ? humedad : 0);
    const kgSecos = pesoNetoLlegada * (1.0 - (humPct / 100.0));
    
    let qFactor = 1.0;
    let liqKg = kgSecos;

    if (modulo === "INFORMAL") {
      const tAjuste = tipoAjuste || "FACTOR";
      const val = valorAjuste !== null && valorAjuste !== undefined ? parseFloat(valorAjuste) : null;
      if (val !== null) {
        if (tAjuste === "PORCENTAJE") {
          qFactor = 1.0 - (val / 100.0);
          liqKg = kgSecos * qFactor;
        } else if (tAjuste === "KILOS") {
          liqKg = Math.max(0, kgSecos - val);
          qFactor = kgSecos > 0 ? liqKg / kgSecos : 0;
        } else { // FACTOR
          qFactor = val;
          liqKg = kgSecos * qFactor;
        }
      } else {
        qFactor = factorManualFallback !== null && factorManualFallback !== undefined ? parseFloat(factorManualFallback) : 1.0;
        liqKg = kgSecos * qFactor;
      }
    } else {
      if (calidadModo === "RUBROS") {
        let descuento_calidad_pct = 0.0;
        if (calidadParametros && calidadParametros.length > 0) {
          calidadParametros.forEach(p => {
            const exceso = Math.max(0, p.valor_declarado - p.tolerancia);
            if (exceso > 0) {
              descuento_calidad_pct += -(exceso * (p.descuento_por_punto || 0)) + (exceso * (p.bonificacion_por_punto || 0));
            }
          });
        }
        qFactor = 1.0 + (descuento_calidad_pct / 100.0);
        liqKg = kgSecos * qFactor;
      } else {
        qFactor = tempFactor !== null && tempFactor !== undefined ? parseFloat(tempFactor) : (factorManualFallback !== null && factorManualFallback !== undefined ? parseFloat(factorManualFallback) : 1.0);
        liqKg = kgSecos * qFactor;
      }
    }
    
    return { kgSecos, qFactor, liqKg, humPct, humKg: pesoNetoLlegada * (humPct / 100.0) };
  };
  const [movForm, setMovForm] = useState({
    productor_nombre: globalFiltroProductor || "",
    comprador_nombre: "",
    id_contrato_compra: null,
    id_contrato_venta: null,
    nro_cpe: "",
    nro_ctg: "",
    fecha_cpe: "",
    fecha_vencimiento_cpe: "",
    titular_cpe_cuit: "",
    titular_cpe_nombre: globalFiltroProductor || "",
    remitente_comercial_productor_cuit: "",
    remitente_comercial_productor_nombre: globalFiltroProductor || "",
    rte_primaria_cuit: "",
    rte_primaria_nombre: "",
    destinatario_cuit: "",
    destinatario_nombre: "",
    destino_cuit: "",
    destino_nombre: "",
    flete_pagador_cuit: "",
    flete_pagador_nombre: globalFiltroProductor || "",
    id_especie: globalFiltroEspecie ? (ESPECIES.indexOf(globalFiltroEspecie) !== -1 ? ESPECIES.indexOf(globalFiltroEspecie) + 1 : 1) : 1,
    id_campana: 2,
    declaracion_calidad: "CONFORME",
    observaciones: "",
    localidad_origen: "",
    provincia_origen: "",
    renspa: "",
    descripcion_campo: "",
    latitud: "",
    longitud: "",
    localidad_destino: "",
    provincia_destino: "",
    nro_planta_destino: "",
    direccion_destino: "",

                    <option value="true">Activo</option>

                </div>
                <div>
                  <label className="form-label">Contraseña *</label>
                  <input type="password" placeholder="••••••••" value={nuevoUsuario.contrasena} onChange={e=>setNuevoUsuario({...nuevoUsuario,contrasena:e.target.value})}/>
                </div>
                <div>
                  <label className="form-label">Nombre Completo *</label>
                  <input placeholder="Ej: Juan Gómez" value={nuevoUsuario.nombre} onChange={e=>setNuevoUsuario({...nuevoUsuario,nombre:e.target.value})}/>
                </div>
                <div>
                  <label className="form-label">Rol *</label>
                  <select value={nuevoUsuario.rol} onChange={e=>setNuevoUsuario({...nuevoUsuario,rol:e.target.value})} style={{width:"100%",padding:"8px 10px",background:"#0f1117",border:"1px solid #2a2d3e",borderRadius:6,color:"#e8eaf0"}}>

              </div>
