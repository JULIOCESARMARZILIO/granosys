      )}
    </div>
  );
};

// ── APP PRINCIPAL ──
const DocumentosArca = () => {
  const [fuente,setFuente]=useState("WSFE_EMITIDA");
  const [documentos,setDocumentos]=useState([]);
  const [paginacion,setPaginacion]=useState({pagina:1,paginas:1,total:0});
  const [conciliacion,setConciliacion]=useState({totalCuits:0,vinculadas:0,pendientes:0});
  const [ivaVentas,setIvaVentas]=useState({totales:{},periodos:[],alicuotas:[],tributos:[],controlIntegridad:{observados:0}});
  const [ccConciliaciones,setCcConciliaciones]=useState({total:0,pendientesSinContraparte:0,posiblesDuplicados:0,conciliaciones:[]});
  const [syncJobs,setSyncJobs]=useState([]);
  const [sincronizando,setSincronizando]=useState(false);
  const [syncError,setSyncError]=useState("");
  const [loteCtgs,setLoteCtgs]=useState("");
  const [buscar,setBuscar]=useState("");
  const [desde,setDesde]=useState("2026-01-01");
  const [hasta,setHasta]=useState("");
  const [pagina,setPagina]=useState(1);
  const [cargando,setCargando]=useState(false);
  const [detalle,setDetalle]=useState(null);
  const [error,setError]=useState("");

  const cargar = async (paginaSolicitada=pagina, fuenteSolicitada=fuente) => {
    setCargando(true); setError("");
    try {
      const params=new URLSearchParams({fuente:fuenteSolicitada,desde,pagina:String(paginaSolicitada),limite:"50"});
      if(hasta) params.set("hasta",hasta);
      if(buscar.trim()) params.set("buscar",buscar.trim());
      const obtenerDocumentos=async()=>{
        let respuesta=null;
        for(let intento=0;intento<3&&!respuesta;intento+=1) {
          respuesta=await api.get(`/api/arca/documentos?${params.toString()}`);
          if(!respuesta&&intento<2) await new Promise(resolve=>setTimeout(resolve,600));
        }
        if(!respuesta) throw new Error("La lista de Documentos ARCA no respondio. La sincronizacion puede continuar; usa Actualizar para reintentar la consulta.");
        return respuesta;
      };
      if(fuenteSolicitada==="WSCPE_CPE") {
        const docs=await obtenerDocumentos();
        setDocumentos(docs?.documentos||[]);
        setPaginacion(docs?.paginacion||{pagina:1,paginas:1,total:0});
        return;
      }
      const ivaParams=new URLSearchParams({desde});
      if(hasta) ivaParams.set("hasta",hasta);
      const [docs,concil,iva,ccConcil]=await Promise.all([
        obtenerDocumentos(),
        api.get("/api/arca/documentos/conciliacion-contrapartes"),
        api.get(`/api/arca/documentos/iva-ventas/resumen?${ivaParams.toString()}`),
        api.get(`/api/arca/cc/conciliaciones?${ivaParams.toString()}&estado=PENDIENTE&limite=200`)
      ]);
      setDocumentos(docs?.documentos||[]);
      setPaginacion(docs?.paginacion||{pagina:1,paginas:1,total:0});
      setConciliacion(concil||{totalCuits:0,vinculadas:0,pendientes:0});
      setIvaVentas(iva?.resultado||{totales:{},periodos:[],alicuotas:[],tributos:[],controlIntegridad:{observados:0}});
      setCcConciliaciones(ccConcil?.resultado||{total:0,pendientesSinContraparte:0,posiblesDuplicados:0,conciliaciones:[]});
    } catch(e) { setError(e.message||"No se pudieron cargar los documentos ARCA."); }
    finally { setCargando(false); }
  };
  useEffect(()=>{cargar(pagina);},[pagina,fuente]);

  const money=value=>Number(value||0).toLocaleString("es-AR",{style:"currency",currency:"ARS"});
  const esCpe=fuente==="WSCPE_CPE";
  const tipoNombre=tipo=>({1:"Factura A",2:"Nota de Débito A",3:"Nota de Crédito A",6:"Factura B",7:"Nota de Débito B",8:"Nota de Crédito B",11:"Factura C",12:"Nota de Débito C",13:"Nota de Crédito C",201:"Factura de Crédito MiPyME A",206:"Factura de Crédito MiPyME B"}[Number(tipo)]||`Tipo ${tipo||"-"}`);
  const decidirCc = async (item,decision) => {
    const accion=decision==="VINCULAR_EXISTENTE"?"vincular el movimiento existente":decision==="CREAR_MOVIMIENTO"?"crear un movimiento FORMAL en cuenta corriente":"rechazar la conciliación";
    if(!window.confirm(`Confirmá ${accion} para ${item.contraparte||item.receptor_cuit} por ${money(item.importe)}. Esta decisión quedará auditada.`)) return;
    setCargando(true);
    try {
      const result=await api.post(`/api/arca/cc/conciliaciones/${item.document_id}/decidir`,{
        decision,
        ccMovimientoId:decision==="VINCULAR_EXISTENTE"?item.candidato_cc_id:null
      });
      if(!result?.ok) return alert("No se pudo completar la conciliación. Revisá contraparte, importe y permisos.");
      await cargar(1);
    } finally {
      setCargando(false);
    }
  };
  const autorizarAltaContraparte = async item => {
    const cuit=String(item.receptor_cuit||"").replace(/\D/g,"");
    if(cuit.length!==11) return alert("El comprobante no tiene un CUIT receptor válido.");
    setCargando(true);
    try {
      let oficial={};
      try {
        const respuestaA13=await api.get(`/api/arca/padron/${cuit}`);
        const contribuyente=respuestaA13?.contribuyente||respuestaA13||{};
        const padron=contribuyente?.datos_padron||contribuyente||{};
        const generales=padron.datosGenerales||padron||{};
        const domicilio=generales.domicilioFiscal||padron.domicilio_fiscal||{};
        oficial={
          cuit,
          razon_social:padron.razon_social||generales.razonSocial||
            `${generales.apellido||""} ${generales.nombre||""}`.trim(),
          condicion_iva:padron.condicion_iva||"RI",
          domicilio:domicilio.direccion||"",
          localidad:domicilio.localidad||"",
          provincia:domicilio.descripcionProvincia||domicilio.provincia||"",
          origen:"PADRON_ARCA_A13"
        };
      } catch(e) {
        oficial={};
      }
      if(!String(oficial.razon_social||"").trim()) {
        oficial=await api.get(`/api/contrapartes/consulta-arca/${cuit}`);
      }
      const razonSocialOficial=String(oficial?.razon_social||"").trim();
      const razonSocial=razonSocialOficial||String(window.prompt(
        `ARCA no devolvió la razón social del CUIT ${cuit}.\nIngresala manualmente para crear la contraparte:`,
        ""
      )||"").trim();
      if(!razonSocial) return alert("La razón social es obligatoria. No se creó ninguna contraparte.");
      const mensaje=[
        "AUTORIZACIÓN HUMANA DE ALTA",
        `CUIT: ${cuit}`,
        `Razón social oficial: ${razonSocial}`,
        "Tipo: COMPRADOR · Canal: FORMAL",
        "",
        "Al confirmar se creará la contraparte y se vincularán automáticamente sus comprobantes ARCA por CUIT.",
        "No se generarán movimientos de cuenta corriente."
      ].join("\n");
      if(!window.confirm(mensaje)) return;
      await api.post("/api/contrapartes",{
        cuit,
        razon_social:razonSocial,
        tipo_contraparte:"COMPRADOR",
        canal_operacion:"FORMAL",
        condicion_iva:oficial.condicion_iva||"RI",
        domicilio:oficial.domicilio||"",
        localidad:oficial.localidad||"",
        provincia:oficial.provincia||"",
        observaciones:razonSocialOficial
          ? `Alta autorizada por usuario desde Documentos ARCA. Origen: ${oficial.origen||"ARCA"}.`
          : "Alta autorizada desde Documentos ARCA con razón social ingresada manualmente; pendiente de validación contra padrón."
      });
      await cargar(1);
      alert(`Contraparte ${razonSocial} creada y vinculada por CUIT. Ahora podés decidir la cuenta corriente.`);
    } catch(e) {
      alert(e.message||"No se pudo crear la contraparte. No se realizó ningún cambio.");
    } finally {
      setCargando(false);
    }
  };
  const esperarSync = async job => {
    for(let intento=0;intento<180;intento+=1) {
      const respuesta=await api.get(`/api/arca/sync/${job.id}`);
      if(!respuesta?.job) {
        await new Promise(resolve=>setTimeout(resolve,2000));
        continue;
      }
      const actual=respuesta.job;
      setSyncJobs(prev=>prev.map(item=>item.id===actual.id?actual:item));
      if(["COMPLETADO","PARCIAL","ERROR"].includes(actual.estado)) return actual;
      await new Promise(resolve=>setTimeout(resolve,2000));
    }
    throw new Error(`La sincronización ${job.fuente} continúa en proceso. Podés actualizar la pantalla más tarde.`);
  };
  const sincronizarDesdeArca = async () => {
    if(!window.confirm(`Se consultará ARCA desde ${desde} y se guardarán copias oficiales en GranoSYS. No se emitirán comprobantes ni se crearán movimientos contables. ¿Continuar?`)) return;
    setSincronizando(true);
    setSyncError("");
    setSyncJobs([]);
    try {
      const [facturas,granos]=await Promise.all([
        api.post("/api/arca/sync/facturas-emitidas",{desde,limite:5000}),
        api.post("/api/arca/sync/granos",{desde,limite:5000,puntosEmision:Array.from({length:20},(_,i)=>i+1)})
      ]);
      const jobs=[facturas.job,granos.job].filter(Boolean);
      setSyncJobs(jobs);
      const terminados=await Promise.all(jobs.map(esperarSync));
      const fallidos=terminados.filter(job=>job.estado==="ERROR");
      if(fallidos.length) setSyncError(fallidos.map(job=>`${job.fuente}: ${job.error}`).join(" · "));
      await cargar(1);
    } catch(e) {
      setSyncError(e.message||"No se pudo completar la sincronización.");
    } finally {
      setSincronizando(false);
    }
  };

  const sincronizarCpeDesdeArca = async () => {
    setSincronizando(true);
    setSyncError("");
    setSyncJobs([]);
    try {
      const inicio=desde<"2026-02-01"?"2026-02-01":desde;
      const fin=hasta||new Date().toISOString().slice(0,10);
      const respuesta=await api.post("/api/arca/sync/cpe-destino",{desde:inicio,hasta:fin});
      if(!respuesta?.job) throw new Error("No se pudo iniciar la consulta WSCPE.");
      setSyncJobs([respuesta.job]);
      const terminado=await esperarSync(respuesta.job);
      if(terminado.estado==="ERROR"||terminado.estado==="PARCIAL") {
        setSyncError(terminado.error||"ARCA devolvio observaciones durante la consulta de CPE.");
      }
      setFuente("WSCPE_CPE");
      setDesde(inicio);
      setPagina(1);
      await cargar(1,"WSCPE_CPE");
    } catch(e) {
      setSyncError(e.message||"No se pudo completar la sincronizacion de CPE.");
    } finally {
      setSincronizando(false);
    }
  };

  const importarCtgPegados = async () => {
    const ctgs=[...new Set((loteCtgs.match(/\d{8,20}/g)||[]).map(valor=>valor.trim()))];
    if(!ctgs.length) {
      setSyncError("Pegá al menos un CTG/CTDG válido.");
      return;
    }
    if(ctgs.length>5000) {
      setSyncError("El máximo por lote es 5.000 CTG/CTDG.");
      return;
    }
    setSincronizando(true);
    setSyncError("");
    setSyncJobs([]);
    try {
      const respuesta=await api.post("/api/arca/sync/cpe-por-ctg",{ctgs,desde:desde<"2026-02-01"?"2026-02-01":desde});
      if(!respuesta?.job) throw new Error("No se pudo iniciar la consulta masiva por CTG/CTDG.");
      setSyncJobs([respuesta.job]);
      const terminado=await esperarSync(respuesta.job);
      if(terminado.estado==="ERROR"||terminado.estado==="PARCIAL") setSyncError(terminado.error||"ARCA devolvió observaciones para algunos CTG/CTDG.");
      setFuente("WSCPE_CPE");
      setPagina(1);
      await cargar(1,"WSCPE_CPE");
      if(terminado.estado==="COMPLETADO") setLoteCtgs("");
    } catch(e) {
      setSyncError(e.message||"No se pudo importar el lote de CTG/CTDG.");
    } finally {
      setSincronizando(false);
    }
  };

  const importarListadoCtgArca = () => {
    const input=document.createElement("input");
    input.type="file";
    input.accept=".xlsx,.xls,.csv,.txt";
    input.onchange=async event=>{
      const archivo=event.target.files?.[0];
      if(!archivo) return;
      setSincronizando(true);
      setSyncError("");
      setSyncJobs([]);
      try {
        const data=await archivo.arrayBuffer();
        const workbook=XLSX.read(data,{type:"array",raw:false});
        const encontrados=new Set();
        workbook.SheetNames.forEach(nombre=>{
          const filas=XLSX.utils.sheet_to_json(workbook.Sheets[nombre],{header:1,defval:"",raw:true});
          let filaCabecera=-1;
          let columnaCtg=-1;
          for(let i=0;i<Math.min(filas.length,30)&&columnaCtg<0;i+=1) {
            const indice=(filas[i]||[]).findIndex(celda=>{
              const cabecera=String(celda||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
              return ["ctg","nctg","nroctg","numeroctg"].includes(cabecera);
            });
            if(indice>=0) { filaCabecera=i; columnaCtg=indice; }
          }
          if(columnaCtg<0) return;
          filas.slice(filaCabecera+1).forEach(fila=>{
            const valor=fila[columnaCtg];
            const texto=String(valor??"").trim();
            const ctg=/^[+-]?\d+(?:[.,]\d+)?e[+-]?\d+$/i.test(texto)&&Number.isSafeInteger(Number(texto))
              ? String(Number(texto))
              : texto.replace(/\D/g,"");
            if(/^\d{8,20}$/.test(ctg)) encontrados.add(ctg);
          });
        });
        const ctgs=[...encontrados];
        if(!ctgs.length) throw new Error("El archivo no contiene una columna CTG reconocible.");
        if(!window.confirm(`Se encontraron ${ctgs.length} CTG unicos. GranoSYS consultara detalle y PDF por WSCPE sin modificar ARCA. ¿Continuar?`)) return;
        const respuesta=await api.post("/api/arca/sync/cpe-por-ctg",{ctgs,desde:desde<"2026-02-01"?"2026-02-01":desde});
        if(!respuesta?.job) throw new Error("No se pudo iniciar la consulta masiva por CTG.");
        setSyncJobs([respuesta.job]);
        const terminado=await esperarSync(respuesta.job);
        if(terminado.estado==="ERROR"||terminado.estado==="PARCIAL") setSyncError(terminado.error||"ARCA devolvio observaciones para algunos CTG.");
        setFuente("WSCPE_CPE");
        setPagina(1);
        await cargar(1,"WSCPE_CPE");
      } catch(e) {
        setSyncError(e.message||"No se pudo importar el listado de CTG.");
      } finally {
        setSincronizando(false);
      }
    };
    input.click();
  };

  const materializarCpeEnMovimientos = async () => {
    setSincronizando(true);
    setSyncError("");
    try {
      const resultado=await api.post("/api/arca/sync/cpe-a-movimientos",{desde:desde<"2026-02-01"?"2026-02-01":desde});
      const resumen=resultado?.resultado||resultado||{};
      alert([
        "CPE procesadas para Movimientos.",
        `Creadas: ${resumen.creados||0}`,
        `Ya vinculadas/existentes: ${(resumen.existentes||0)+(resumen.vinculadosExistentes||0)}`,
        `Pendientes: ${resumen.pendientes||0}`
      ].join("\n"));
      await cargar(1,"WSCPE_CPE");
    } catch(e) {
      setSyncError(e.message||"No se pudieron pasar las CPE a Movimientos.");
    } finally {
      setSincronizando(false);
    }
  };

  const abrirPdfOficial = async documento => {
    try {
      const response=await fetch(`${API_URL}/api/arca/documentos/${documento.id}/pdf`,{headers:authHeaders()});
      if(!response.ok) throw new Error(await response.text());
      const blob=await response.blob();
      const url=URL.createObjectURL(blob);
      window.open(url,"_blank","noopener,noreferrer");
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    } catch(e) {
      alert("No se pudo abrir el PDF oficial: "+e.message);
    }
  };

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:18,gap:12}}>
      <div><h2 style={{fontSize:20,fontWeight:700,marginBottom:4}}>Documentos ARCA</h2><div style={{fontSize:12,color:"#8890a8"}}>{esCpe?"Cartas de Porte Electronicas de granos y derivados vinculadas a Inversiones del Salado S.A. · Solo consulta":"Comprobantes oficiales emitidos por Inversiones del Salado S.A. · Solo consulta"}</div></div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <Btn variant={esCpe?"secondary":"primary"} onClick={()=>{setFuente("WSFE_EMITIDA");setDesde("2026-01-01");setPagina(1);}}>Facturas</Btn>
        <Btn variant={esCpe?"primary":"secondary"} onClick={()=>{setFuente("WSCPE_CPE");setDesde("2026-02-01");setPagina(1);}}>CPE / CPEDG</Btn>
        <Btn onClick={()=>cargar(pagina)} disabled={cargando}>{cargando?"Actualizando...":"Actualizar"}</Btn>
      </div>
    </div>
    {!esCpe&&<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:16}}>
      {[["Comprobantes",paginacion.total,"#3498db"],["CUIT receptores",conciliacion.totalCuits,"#f5a623"],["Contrapartes vinculadas",conciliacion.vinculadas,"#27ae60"],["Pendientes de alta",conciliacion.pendientes,"#e74c3c"]].map(([label,value,color])=>
        <div className="card" key={label} style={{padding:"14px 16px"}}><div style={{fontSize:11,color:"#8890a8",textTransform:"uppercase"}}>{label}</div><div style={{fontSize:24,fontWeight:700,color,marginTop:5}}>{value||0}</div></div>
      )}
    </div>}
    {esCpe&&<div className="card" style={{padding:"14px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{fontSize:11,color:"#8890a8",textTransform:"uppercase"}}>CPE / CPEDG almacenadas</div><div style={{fontSize:24,fontWeight:700,color:"#3498db",marginTop:5}}>{paginacion.total||0}</div></div>
      <div style={{fontSize:11,color:"#8890a8",maxWidth:520}}>Identidad unica por CTG. El detalle oficial, los intervinientes, las plantas y el PDF quedan vinculados sin duplicados.</div>
    </div>}
    <div className="card" style={{padding:"14px 16px",marginBottom:16,border:"1px solid #2f5f88"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:16}}>
        <div>
          <div style={{fontSize:15,fontWeight:700}}>Sincronizacion oficial ARCA</div>

        <div style={{marginTop:14}}><div className="form-label">Datos oficiales completos</div><pre style={{maxHeight:360,overflow:"auto",padding:12,background:"#0d1017",border:"1px solid #252837",borderRadius:7,fontSize:11,whiteSpace:"pre-wrap"}}>{JSON.stringify(detalle.payload?.detalle||detalle.payload,null,2)}</pre></div>
        <div style={{marginTop:14,fontSize:11,color:"#565d7a"}}>Hash SHA-256: {detalle.payload_hash}</div>
      </div>:<React.Fragment><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <FF label="Tipo"><div>{tipoNombre(detalle.payload?.CbteTipo)}</div></FF><FF label="Fecha"><div>{String(detalle.document_date||"").slice(0,10)}</div></FF>
        <FF label="Punto de venta / número"><div>{detalle.payload?.PtoVta} / {detalle.payload?.CbteDesde}</div></FF><FF label="CUIT receptor"><div>{detalle.payload?.DocNro||"-"}</div></FF>
        <FF label="Importe total"><div>{money(detalle.payload?.ImpTotal)}</div></FF><FF label="Moneda"><div>{detalle.payload?.MonId||"-"} · Cotización {detalle.payload?.MonCotiz||"-"}</div></FF>
        <FF label="Neto gravado"><div>{money(detalle.payload?.ImpNeto)}</div></FF><FF label="IVA"><div>{money(detalle.payload?.ImpIVA)}</div></FF>
        <FF label="Exento / no gravado"><div>{money(detalle.payload?.ImpOpEx)} / {money(detalle.payload?.ImpTotConc)}</div></FF><FF label="Otros tributos"><div>{money(detalle.payload?.ImpTrib)}</div></FF>
        <FF label="Contraparte"><div>{detalle.contraparte_razon_social||"Pendiente de alta"}</div></FF><FF label="Código de autorización"><div style={{fontFamily:"monospace"}}>{detalle.payload?.CodAutorizacion||"-"}</div></FF>
      </div><div style={{marginTop:14,fontSize:11,color:"#565d7a"}}>Hash SHA-256: {detalle.payload_hash}</div></React.Fragment>}

};

const Auditoria = () => {
  const [registros, setRegistros] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [filtroModulo, setFiltroModulo] = useState("");
  const [filtroUsuario, setFiltroUsuario] = useState("");
  const [filtroAccion, setFiltroAccion] = useState("");

  const cargar = async () => {
    setCargando(true);
    const params = new URLSearchParams();
    if (filtroModulo) params.set("modulo", filtroModulo);
    if (filtroUsuario) params.set("usuario", filtroUsuario);
    if (filtroAccion) params.set("accion", filtroAccion);
    const data = await api.get(`/api/auditoria?${params.toString()}`);
    setRegistros(data || []);
    setCargando(false);
  };

  useEffect(() => { cargar(); }, []);

  const inputStyle = {padding:"6px 10px",background:"#0f1117",border:"1px solid #2a2d3e",color:"#e8eaf0",borderRadius:4};

  return (
    <div style={{padding:24}}>
      <h2 style={{marginBottom:4}}>Auditoría</h2>
      <div style={{color:"#8890a8",fontSize:12,marginBottom:16}}>
        Historial de cambios del sistema. Es de solo lectura: ningún usuario, incluido el administrador, puede editar o borrar estos registros.
      </div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <input placeholder="Buscar por usuario..." value={filtroUsuario} onChange={e=>setFiltroUsuario(e.target.value)} style={inputStyle}/>
        <select value={filtroModulo} onChange={e=>setFiltroModulo(e.target.value)} style={inputStyle}>
          <option value="">Todos los módulos</option>
          <option value="contratos">Contratos</option>
          <option value="movimientos">Movimientos</option>
          <option value="liquidaciones">Liquidaciones</option>
          <option value="usuarios">Usuarios</option>
          <option value="CONTRAPARTES">Propuestas IA: Contrapartes</option>
          <option value="CONTRATOS">Propuestas IA: Contratos</option>
          <option value="MOVIMIENTOS">Propuestas IA: Movimientos</option>
          <option value="LIQUIDACIONES">Propuestas IA: Liquidaciones</option>
        </select>
        <select value={filtroAccion} onChange={e=>setFiltroAccion(e.target.value)} style={inputStyle}>
          <option value="">Todas las acciones</option>
          <option value="CREAR">Crear</option>
          <option value="MODIFICAR">Modificar</option>
          <option value="ELIMINAR">Eliminar</option>
          <option value="CAMBIAR_ESTADO">Cambiar estado</option>
          <option value="CREAR_PROPUESTA">Propuesta creada (Agente IA)</option>
          <option value="APROBAR_PROPUESTA">Propuesta aprobada</option>
          <option value="RECHAZAR_PROPUESTA">Propuesta rechazada</option>
        </select>
        <Btn onClick={cargar} size="sm">Filtrar</Btn>
      </div>
      {cargando ? <div>Cargando...</div> : (
        <div style={{overflowX:"auto",border:"1px solid #2a2d3e",borderRadius:8}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{textAlign:"left",borderBottom:"1px solid #2a2d3e",color:"#8890a8"}}>
                <th style={{padding:8}}>Fecha</th>
                <th style={{padding:8}}>Usuario</th>
                <th style={{padding:8}}>Acción</th>
                <th style={{padding:8}}>Módulo</th>
                <th style={{padding:8}}>Registro</th>
                <th style={{padding:8}}></th>
              </tr>
            </thead>
            <tbody>
              {registros.map(r => <RegistroAuditoria key={r.id} r={r}/>)}
              {registros.length === 0 && (
                <tr><td colSpan={6} style={{padding:16,textAlign:"center",color:"#565d7a"}}>No hay registros para estos filtros.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
};

// ── CALCULADORA DE CAPACIDAD DE PAGO (reutilizable -- la usa Produccion/Maquila) ──
const CalculadoraCapacidadPago = () => {
  const [especies, setEspecies] = useState([]);
  const [calcEspecie, setCalcEspecie] = useState("");
  const [calcCostoMolienda, setCalcCostoMolienda] = useState("");
  const [calcResultado, setCalcResultado] = useState(null);
  const [calculando, setCalculando] = useState(false);

  useEffect(()=>{ api.get("/api/especies").then(d=>setEspecies(d||[])); },[]);
  const especiesGrano = especies.filter(e=>e.tipo_producto!=="SUBPRODUCTO");

  const calcularCapacidadPago = async () => {
    if (!calcEspecie) { alert("Elegí el grano"); return; }
    setCalculando(true);
    try {
      const r = await api.get(`/api/posicion/capacidad-pago?id_especie=${calcEspecie}&costo_molienda=${calcCostoMolienda||0}`);
      setCalcResultado(r);
    } catch(e) { alert("Error: " + (e.response?.data?.error || e.message)); }
    finally { setCalculando(false); }
  };

  return (
    <div className="card" style={{padding:"16px 20px",marginBottom:20}}>
      <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Calculadora de Capacidad de Pago</div>
      <p style={{color:"#8890a8",fontSize:12,marginBottom:12}}>
        Cuánto podés pagar como máximo por el grano para que, convertido en subproductos y descontado el costo de molienda, siga siendo negocio. Por encima de este precio para ese destino, perdés plata; por debajo, ganás.
      </p>
      <div style={{display:"flex",gap:8,alignItems:"end",flexWrap:"wrap"}}>
        <FF label="Grano">
          <select value={calcEspecie} onChange={e=>{setCalcEspecie(e.target.value);setCalcResultado(null);}}>
            <option value="">Seleccionar...</option>
            {especiesGrano.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}
          </select>
        </FF>
        <FF label="Costo de molienda ($/tn)"><input type="number" value={calcCostoMolienda} onChange={e=>setCalcCostoMolienda(e.target.value)} placeholder="Ej: 65000"/></FF>
        <Btn size="sm" disabled={calculando} onClick={calcularCapacidadPago}>{calculando?"Calculando...":"Calcular"}</Btn>
      </div>
      {calcResultado && (
        <div style={{marginTop:14,paddingTop:14,borderTop:"1px solid #2a2d3e"}}>
          <table style={{fontSize:13}}>
            <thead><tr><th>Subproducto</th><th>Rendimiento</th><th>Precio de referencia</th><th>Aporte por tn de grano</th></tr></thead>
            <tbody>
              {calcResultado.detalle.map((d,i)=>(
                <tr key={i}>
                  <td>{d.especie_nombre}</td>
                  <td className="mono">{d.rendimiento_pct}%</td>
                  <td className="mono">{d.precio_referencia!=null?`$ ${Number(d.precio_referencia).toLocaleString("es-AR")}`:<span style={{color:"#e74c3c"}}>Sin cargar</span>}</td>
                  <td className="mono">{d.aporte_por_ton!=null?`$ ${Number(d.aporte_por_ton).toLocaleString("es-AR")}`:"—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {calcResultado.falta_algun_precio && (
            <div style={{color:"#e74c3c",fontSize:12,marginTop:8}}>⚠ Falta cargar el precio de referencia de algún subproducto (Configuración → Precios de Referencia) — el cálculo está incompleto.</div>
          )}
          <div style={{marginTop:12,display:"flex",gap:24}}>
            <div>
              <div style={{fontSize:11,color:"#8890a8"}}>Ingreso teórico por tn</div>
              <div style={{fontSize:18,fontWeight:700}}>$ {Number(calcResultado.ingreso_teorico_por_ton).toLocaleString("es-AR")}</div>
            </div>
            <div>
              <div style={{fontSize:11,color:"#8890a8"}}>Capacidad de pago por tn</div>
              <div style={{fontSize:22,fontWeight:700,color:"#f5a623"}}>$ {Number(calcResultado.capacidad_pago_por_ton).toLocaleString("es-AR")}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ── COMPONENTE CERTIFICADOS 1116 (carga manual, ARCA no los lista automatico cuando los emite un corredor) ──
const MAX_CTGS_1116 = 20;
const Certificados1116 = ({usuario}) => {
  const [lista, setLista] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [expandido, setExpandido] = useState(null);
  const [form, setForm] = useState({
    tipo_formulario: "A", numero_certificado: "", coe: "", cuit_productor: "", nombre_productor: "",
    kilos_netos: "", fecha_emision: "", direccion: "", observaciones: ""
  });
  const [ctgsForm, setCtgsForm] = useState([""]);
  const [guardando, setGuardando] = useState(false);
  const [trazabilidad, setTrazabilidad] = useState([]);
  const [generandoTrazabilidad, setGenerandoTrazabilidad] = useState(false);
  const [extrayendoCertificados, setExtrayendoCertificados] = useState(false);
  const [resultadoExtraccion, setResultadoExtraccion] = useState(null);

  const cargar = async () => {
    setCargando(true);
    const [res, trace] = await Promise.all([
      api.get("/api/certificados-1116"),
      api.get("/api/certificados-1116/trazabilidad").catch(()=>({vinculos:[]}))
    ]);
    setLista(res || []);
    setTrazabilidad(trace?.vinculos || []);
    setCargando(false);
  };
  useEffect(()=>{ cargar(); },[]);

  const setCtg = (i, val) => {
    const copia = [...ctgsForm];
    copia[i] = val;
    setCtgsForm(copia);
  };
  const agregarCtg = () => {
    if (ctgsForm.length >= MAX_CTGS_1116) return;
    setCtgsForm([...ctgsForm, ""]);
  };
  const quitarCtg = (i) => {
    if (ctgsForm.length === 1) { setCtgsForm([""]); return; }
    setCtgsForm(ctgsForm.filter((_,idx)=>idx!==i));
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!form.coe) { alert("El C.O.E. es obligatorio"); return; }
    setGuardando(true);
    try {
      const r = await api.post("/api/certificados-1116", {
        ...form,
        kilos_netos: form.kilos_netos ? parseFloat(form.kilos_netos) : null,
        ctgs: ctgsForm.map(c=>c.trim()).filter(Boolean)
      });
      if (r && r.error) { alert("Error: " + r.error); return; }
      setForm({ tipo_formulario: "A", numero_certificado: "", coe: "", cuit_productor: "", nombre_productor: "", kilos_netos: "", fecha_emision: "", direccion: "", observaciones: "" });
      setCtgsForm([""]);
      cargar();
    } catch(err) { alert("Error: " + err.message); }
    finally { setGuardando(false); }
  };

  const eliminar = async (id) => {
    if (!confirm("¿Eliminar este certificado?")) return;
    await api.delete(`/api/certificados-1116/${id}`);
    cargar();
  };

  const generarTrazabilidad = async () => {
    setGenerandoTrazabilidad(true);
    try {
      const result = await api.post("/api/certificados-1116/trazabilidad/generar", {});
      if (result?.error) throw new Error(result.error);
      await cargar();
      alert(`Conciliación terminada. Certificados: ${result?.resultado?.processedCertificates || 0}; CPE evaluadas: ${result?.resultado?.evaluatedCpes || 0}; liquidaciones evaluadas: ${result?.resultado?.evaluatedLiquidations || 0}.`);
    } catch (err) { alert("No se pudo generar la trazabilidad: " + err.message); }
    finally { setGenerandoTrazabilidad(false); }
  };

  const esperarJob = async (path, id, onStage) => {
    for (let intento=0; intento<240; intento++) {
      const response = await api.get(`${path}/${id}`);
      const job = response?.job;
      if (!job) throw new Error("No se pudo consultar el avance");
      onStage(job.etapa || job.estado);
      if (job.estado==="COMPLETADO" || job.estado==="PARCIAL") return job;
      if (job.estado==="ERROR") throw new Error(job.error || "El proceso terminó con error");
      await new Promise(resolve=>setTimeout(resolve,3000));
    }
    throw new Error("El proceso continúa en segundo plano. Volvé a intentar en unos minutos.");
  };

  const cargarCpeHistoricas = async () => {
    if (usuario?.rol !== "ADMIN") return alert("Solo un administrador puede ejecutar este proceso.");
    if (!confirm("¿Cargar únicamente las CPE y CPEDG existentes en ARCA desde el 01/02/2026? No se procesarán certificados, calidades ni liquidaciones.")) return;
    setExtrayendoCertificados(true);
    setResultadoExtraccion(null);
    try {
      const cpeStart = await api.post("/api/arca/sync/cpe-destino", {desde:"2026-02-01"});
      if (!cpeStart?.job?.id) throw new Error(cpeStart?.error || "No se pudo iniciar la carga de CPE/CPEDG");
      setResultadoExtraccion({etapa:"CARGANDO_CPE_Y_CPEDG",cpeJob:cpeStart.job.id});
      const cpeJob = await esperarJob("/api/arca/sync",cpeStart.job.id,etapa=>setResultadoExtraccion(prev=>({...prev,etapa})));
      const resultado = {etapa:"FINALIZADO",cpe:cpeJob};
      setResultadoExtraccion(resultado);
      alert(`Carga de CPE/CPEDG terminada. Revisadas: ${cpeJob.total_revisados||0}; importadas/actualizadas: ${cpeJob.total_importados||0}. No se procesaron certificados ni liquidaciones.`);
    } catch (err) {
      alert("No se pudo completar el proceso: " + err.message);
    } finally {
      setExtrayendoCertificados(false);
    }
  };

  const revisarVinculo = async (id, estado) => {
    const action = estado === "CONFIRMADO" ? "confirmar" : "rechazar";
    if (!confirm(`¿Querés ${action} este vínculo documental?`)) return;
    const result = await api.post(`/api/certificados-1116/trazabilidad/${id}/revisar`, {estado});
    if (result?.error) return alert(result.error);
    cargar();
  };

  return (
    <div className="fade-in">
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:18,fontWeight:700}}>Certificados 1116</h2>
        <p style={{color:"#8890a8",fontSize:13,marginTop:2}}>
          Carga manual a partir del PDF real (ARCA no permite listar estos certificados por API cuando los emite un corredor). El dato clave es el C.O.E. Un mismo certificado puede consolidar hasta {MAX_CTGS_1116} cartas de porte/CTG.
        </p>
      </div>

      {usuario?.rol==="ADMIN" && <div className="card" style={{marginBottom:20,border:"1px solid #2f80ed"}}>
        <div className="card-header">
          <div>
            <div style={{fontWeight:700}}>Carga histórica de CPE y CPEDG</div>
            <div style={{fontSize:12,color:"#8890a8",marginTop:3}}>Consulta únicamente las CPE y CPEDG existentes en ARCA desde el 01/02/2026. Conserva su tipo y CTG/CTDG sin duplicar. No asigna certificados, no copia calidades y no procesa liquidaciones.</div>
          </div>
          <Btn onClick={cargarCpeHistoricas} disabled={extrayendoCertificados}>
            {extrayendoCertificados?"Cargando CPE/CPEDG...":"Cargar solamente CPE/CPEDG"}
          </Btn>
        </div>
        {resultadoExtraccion && <div style={{padding:"10px 16px",fontSize:12,color:resultadoExtraccion.etapa==="FINALIZADO"?"#27ae60":"#f5a623"}}>
          Etapa: {String(resultadoExtraccion.etapa||"INICIANDO").replaceAll("_"," ")}
          {resultadoExtraccion.etapa==="FINALIZADO" && <> · Revisadas: {resultadoExtraccion.cpe?.total_revisados||0} · importadas/actualizadas: {resultadoExtraccion.cpe?.total_importados||0}</>}
        </div>}
      </div>}

      <div className="card" style={{marginBottom:20}}>
        <div className="card-header">
          <div>
            <div style={{fontWeight:700}}>Trazabilidad ARCA</div>
            <div style={{fontSize:12,color:"#8890a8",marginTop:3}}>CTG exacto primero. Si falta, propone por suma de kilos, CUIT, especie, campaña y fechas. La planta pertenece a la CPE y no interviene en el certificado. Las coincidencias dudosas requieren decisión humana.</div>
          </div>
          <Btn onClick={generarTrazabilidad} disabled={generandoTrazabilidad}>{generandoTrazabilidad?"Conciliando...":"Conciliar CPE y liquidaciones"}</Btn>
        </div>
        {trazabilidad.length===0 ? <div style={{padding:16,color:"#8890a8",fontSize:12}}>Todavía no hay vínculos calculados.</div> : (
          <div style={{maxHeight:320,overflow:"auto"}}>
            <table>
              <thead><tr><th>Certificado</th><th>Documento relacionado</th><th>Método</th><th>Kilos certificado</th><th>Kilos vinculados</th><th>Diferencia</th><th>Confianza</th><th>Estado</th><th></th></tr></thead>
              <tbody>{trazabilidad.map(link=><tr key={link.id}>
                <td className="mono">{link.certificate_coe || link.numero_certificado}</td>
                <td>{link.link_type==="CERTIFICADO_CPE" ? <span className="mono">CTG {link.ctg}</span> : <span>Liquidación {link.liquidation_external_key}</span>}</td>
                <td style={{fontSize:11}}>{link.method.replaceAll("_"," ")}</td>
                <td className="mono">{link.certificate_kg ? Number(link.certificate_kg).toLocaleString("es-AR") : "—"}</td>
                <td className="mono">{link.linked_kg ? Number(link.linked_kg).toLocaleString("es-AR") : "—"}</td>
                <td className="mono" style={{color:Math.abs(Number(link.kg_difference||0))>50?"#e74c3c":"#27ae60"}}>{link.kg_difference!==null ? Number(link.kg_difference).toLocaleString("es-AR") : "—"}</td>
                <td><Badge label={`${link.score}%`} color={link.score>=90?"green":link.score>=65?"orange":"red"}/></td>
                <td><Badge label={link.status.replaceAll("_"," ")} color={link.status.startsWith("CONFIRMADO")?"green":link.status==="RECHAZADO"?"red":"orange"}/></td>
                <td>{link.status==="PROPUESTO" && <div style={{display:"flex",gap:4}}><Btn size="sm" variant="success" onClick={()=>revisarVinculo(link.id,"CONFIRMADO")}>Confirmar</Btn><Btn size="sm" variant="danger" onClick={()=>revisarVinculo(link.id,"RECHAZADO")}>Rechazar</Btn></div>}</td>
              </tr>)}</tbody>
            </table>
          </div>
        )}
      </div>

      <div className="card" style={{marginBottom:20}}>
        <form onSubmit={handleSubmit} style={{display:"grid",gridTemplateColumns:"repeat(3, 1fr)",gap:10}}>
          <FF label="Tipo (A/B/C)">
            <select value={form.tipo_formulario} onChange={e=>setForm({...form,tipo_formulario:e.target.value})}>
              <option value="A">A — Depósito</option>
              <option value="B">B — Venta</option>
              <option value="C">C — Consignación</option>
            </select>
          </FF>
          <FF label="C.O.E. *"><input required value={form.coe} onChange={e=>setForm({...form,coe:e.target.value})} placeholder="330229775135"/></FF>
          <FF label="N° Certificado"><input value={form.numero_certificado} onChange={e=>setForm({...form,numero_certificado:e.target.value})}/></FF>
          <FF label="CUIT Productor"><input value={form.cuit_productor} onChange={e=>setForm({...form,cuit_productor:e.target.value})}/></FF>
          <FF label="Nombre Productor"><input value={form.nombre_productor} onChange={e=>setForm({...form,nombre_productor:e.target.value})}/></FF>
          <FF label="Kilos Netos"><input type="number" step="0.001" value={form.kilos_netos} onChange={e=>setForm({...form,kilos_netos:e.target.value})}/></FF>
          <FF label="Fecha Emisión"><input type="date" value={form.fecha_emision} onChange={e=>setForm({...form,fecha_emision:e.target.value})}/></FF>
          <FF label="Observaciones"><input value={form.observaciones} onChange={e=>setForm({...form,observaciones:e.target.value})}/></FF>

          <div style={{gridColumn:"span 3"}}>
            <label style={{fontSize:11,color:"#8890a8",display:"block",marginBottom:6}}>CTG asociados (hasta {MAX_CTGS_1116})</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {ctgsForm.map((v,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:4}}>
                  <input style={{width:150}} value={v} placeholder={`CTG #${i+1}`} onChange={e=>setCtg(i,e.target.value)}/>
                  <button type="button" onClick={()=>quitarCtg(i)} style={{background:"none",border:"none",color:"#e74c3c",cursor:"pointer",fontSize:13}}>✕</button>
                </div>
              ))}
              {ctgsForm.length < MAX_CTGS_1116 && (
                <Btn type="button" variant="secondary" size="sm" onClick={agregarCtg}>+ Agregar CTG</Btn>
              )}
            </div>
          </div>

          <div style={{gridColumn:"span 3",display:"flex",justifyContent:"flex-end"}}>
            <Btn type="submit" variant="success" disabled={guardando}>{guardando?"Guardando...":"Registrar Certificado"}</Btn>
          </div>
        </form>
      </div>

      {cargando ? <div>Cargando...</div> : lista.length===0 ? (
        <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>No hay certificados 1116 cargados todavía.</div>
      ) : (
        <div className="card">
          <table>
            <thead><tr><th>Tipo</th><th>C.O.E.</th><th>N° Cert.</th><th>Productor</th><th>Especie</th><th>Kilos</th><th>Fecha</th><th>CTGs</th><th></th></tr></thead>
            <tbody>
              {lista.map(c=>{
                const ctgs = c.ctgs || [];
                const vinculados = ctgs.filter(x=>x.id_movimiento).length;
                return (
                  <React.Fragment key={c.id}>
                    <tr>
                      <td><Badge label={c.tipo_formulario} color="purple"/></td>
                      <td className="mono" style={{fontSize:11}}>{c.coe}</td>
                      <td>{c.numero_certificado || "—"}</td>
                      <td>{c.nombre_productor || c.productor_nombre_cp || c.cuit_productor || "—"}</td>
                      <td>{c.especie_nombre || "—"}</td>
                      <td className="mono">{c.kilos_netos ? Number(c.kilos_netos).toLocaleString("es-AR") : "—"}</td>
                      <td style={{fontSize:12,color:"#8890a8"}}>{c.fecha_emision ? formatFechaAR(c.fecha_emision) : "—"}</td>
                      <td>
                        {ctgs.length===0 ? <span style={{color:"#8890a8",fontSize:11}}>—</span> : (
                          <span style={{cursor:"pointer",textDecoration:"underline",fontSize:12}} onClick={()=>setExpandido(expandido===c.id?null:c.id)}>
                            {ctgs.length} CTG ({vinculados} vinculado{vinculados!==1?"s":""})
                          </span>
                        )}
                      </td>
                      <td><Btn variant="danger" size="sm" onClick={()=>eliminar(c.id)}>✕</Btn></td>
                    </tr>
                    {expandido===c.id && ctgs.length>0 && (
                      <tr>
                        <td colSpan={9} style={{background:"rgba(255,255,255,0.02)",padding:10}}>
                          <table style={{width:"100%",fontSize:11}}>
                            <thead><tr><th>CTG</th><th>Movimiento</th></tr></thead>
                            <tbody>
                              {ctgs.map((x,i)=>(
                                <tr key={i}>
                                  <td className="mono">{x.nro_ctg}</td>
                                  <td>{x.numero_movimiento ? <Badge label={x.numero_movimiento} color="blue"/> : <span style={{color:"#e74c3c"}}>Sin vincular</span>}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
};

// ── COMPONENTE BOLSA POR ZONA ──
// Descargas sin contrato entran a la bolsa de su zona (via el motor de
// stock); desde aca se "saca" de esa bolsa para completar contratos de
// compra, sin tener que vincular camion por camion.
const BolsaPorZona = ({modulo}) => {
  const [bolsas, setBolsas] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [contratos, setContratos] = useState([]);
  const [aplicando, setAplicando] = useState(null); // clave de la bolsa siendo aplicada
  const [contratoSel, setContratoSel] = useState("");
  const [toneladasSel, setToneladasSel] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [camionesDisponibles, setCamionesDisponibles] = useState([]);
  const [cargandoCamiones, setCargandoCamiones] = useState(false);

  const [retirando, setRetirando] = useState(null); // clave de la bolsa con retiro abierto
  const [contrapartes, setContrapartes] = useState([]);
  const [productorSel, setProductorSel] = useState("");
  const [toneladasRetiro, setToneladasRetiro] = useState("");
  const [numero1116rt, setNumero1116rt] = useState("");

  const cargar = async () => {
    setCargando(true);
    const [b, c, cp] = await Promise.all([
      api.get("/api/stock/por-zona"),
      api.get("/api/contratos?vista=todos"),
      api.get("/api/contrapartes")
    ]);
    setBolsas(b||[]);
    setContratos((c||[]).filter(x=>x.tipo_contrato==="COMPRA" && x.modalidad===modulo && x.estado!=="CUMPLIDO" && x.activo!==false));
    setContrapartes((cp||[]).filter(x=>x.tipo_contraparte==="PRODUCTOR"||x.tipo_contraparte==="AMBOS"));
    setCargando(false);
  };

  useEffect(()=>{ cargar(); },[modulo]);

  const fmtTn = (v) => `${Number(v).toLocaleString("es-AR",{minimumFractionDigits:3,maximumFractionDigits:3})} tn`;

  const abrirAplicar = async (bolsa) => {
    const clave = `${bolsa.zona}|${bolsa.id_especie}|${bolsa.id_campana}`;
    setAplicando(clave);
    setContratoSel("");
    setToneladasSel("");
    setCamionesDisponibles([]);
    setCargandoCamiones(true);
    try {
      const camiones = await api.get(`/api/stock/por-zona/${encodeURIComponent(bolsa.zona)}/camiones?id_especie=${bolsa.id_especie}&id_campana=${bolsa.id_campana}`);
      setCamionesDisponibles(camiones || []);
    } catch(e) { /* si falla, se sigue pudiendo aplicar igual -- esto es solo la vista previa */ }
    finally { setCargandoCamiones(false); }
  };

  const aplicar = async (bolsa) => {
    if (!contratoSel || !toneladasSel) { alert("Elegí el contrato y las toneladas"); return; }
    setGuardando(true);
    try {
      const r = await api.post(`/api/contratos/${contratoSel}/aplicar-stock-zona`, {
        zona: bolsa.zona, toneladas: parseFloat(toneladasSel)
      });
      if (r && r.aplicacion) {
        const detalleCamiones = (r.camiones||[]).map(c=>`${c.numero_movimiento}: ${(c.kg/1000).toFixed(3)}tn`).join("\n");
        alert(`✓ Aplicadas ${r.aplicacion.toneladas}tn al contrato, tomadas de ${(r.camiones||[]).length} camión(es):\n${detalleCamiones}`);
        setAplicando(null);
        cargar();
      } else {
        alert("Error: " + (r?.error || "no se pudo aplicar"));
      }
    } catch(e) { alert("Error: " + (e.response?.data?.error || e.message)); }
    finally { setGuardando(false); }
  };

  const contratosDeEspecie = (idEspecie) => contratos.filter(c=>c.id_especie===idEspecie);

  const abrirRetiro = (bolsa) => {
    const clave = `${bolsa.zona}|${bolsa.id_especie}|${bolsa.id_campana}`;
    setRetirando(clave);
    setProductorSel("");
    setToneladasRetiro("");
    setNumero1116rt("");
  };

  const confirmarRetiro = async (bolsa) => {
    if (!productorSel || !toneladasRetiro) { alert("Elegí el productor y las toneladas"); return; }
    setGuardando(true);
    try {
      const r = await api.post("/api/retiros-productor", {
        id_contraparte: parseInt(productorSel), zona: bolsa.zona,
        id_especie: bolsa.id_especie, id_campana: bolsa.id_campana,
        toneladas: parseFloat(toneladasRetiro), numero_1116rt: numero1116rt || null
      });
      if (r && r.retiro) {
        alert(`✓ Retiro registrado: ${r.retiro.toneladas}tn`);
        setRetirando(null);
        cargar();
      } else {
        alert("Error: " + (r?.error || "no se pudo registrar"));
      }
    } catch(e) { alert("Error: " + (e.response?.data?.error || e.message)); }
    finally { setGuardando(false); }
  };

  return (
    <div className="fade-in">
      <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:700}}>Bolsa por Zona</h2>
          <p style={{color:"#8890a8",fontSize:13,marginTop:2}}>
            Lo que entra sin contrato se junta acá, agrupado por zona de referencia. Desde acá se aplica a los contratos de compra hasta completarlos.
          </p>
        </div>
        <Btn variant="secondary" size="sm" onClick={cargar}>↻ Actualizar</Btn>
      </div>

      {cargando ? <div>Cargando...</div> : bolsas.length===0 ? (
        <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>No hay stock en ninguna zona todavía.</div>
      ) : (
        <div className="card">
          <table>
            <thead><tr><th>Zona</th><th>Producto</th><th>Toneladas</th><th>Costo promedio</th><th colSpan={2}></th></tr></thead>
            <tbody>
              {bolsas.map((b,i)=>{
                const clave = `${b.zona}|${b.id_especie}|${b.id_campana}`;
                return (
                  <React.Fragment key={i}>
                    <tr>
                      <td style={{fontWeight:600}}>{b.zona}</td>
                      <td>{b.especie_nombre} <span style={{fontSize:11,color:"#8890a8"}}>({b.campana_desc})</span></td>
                      <td className="mono">{fmtTn(b.toneladas_totales)}</td>
                      <td className="mono">$ {Number(b.costo_promedio_ponderado).toLocaleString("es-AR",{maximumFractionDigits:0})}</td>
                      <td><Btn size="sm" variant="secondary" onClick={()=>abrirAplicar(b)}>Aplicar a contrato</Btn></td>
                      <td><Btn size="sm" variant="secondary" onClick={()=>abrirRetiro(b)}>Retiro de Productor</Btn></td>
                    </tr>
                    {aplicando===clave && (
                      <tr>
                        <td colSpan={6} style={{padding:"10px 16px",background:"#0f1117"}}>
                          <div style={{display:"flex",gap:8,alignItems:"end",flexWrap:"wrap"}}>
                            <FF label="Contrato de compra">
                              <select value={contratoSel} onChange={e=>setContratoSel(e.target.value)}>
                                <option value="">Seleccionar...</option>
                                {contratosDeEspecie(b.id_especie).map(c=>(
                                  <option key={c.id} value={c.id}>{c.numero_contrato} — faltan {(parseFloat(c.cantidad_toneladas_pactadas)-parseFloat(c.cantidad_toneladas_asignadas||0)).toFixed(3)}tn</option>
                                ))}
                              </select>
                            </FF>
                            <FF label="Toneladas a aplicar"><input type="number" value={toneladasSel} onChange={e=>setToneladasSel(e.target.value)} placeholder={`máx ${b.toneladas_totales}`}/></FF>
                            <Btn size="sm" disabled={guardando} onClick={()=>aplicar(b)}>{guardando?"Aplicando...":"Confirmar"}</Btn>
                            <Btn size="sm" variant="ghost" onClick={()=>setAplicando(null)}>Cancelar</Btn>
                          </div>
                          <div style={{marginTop:10}}>
                            <div style={{fontSize:11,color:"#8890a8",marginBottom:4}}>Camiones en esta bolsa (se toman enteros por orden de llegada; el último se parte si hace falta):</div>
                            {cargandoCamiones ? <div style={{fontSize:12,color:"#8890a8"}}>Cargando...</div> : camionesDisponibles.length===0 ? (
                              <div style={{fontSize:12,color:"#8890a8"}}>No hay camiones descargados disponibles en esta bolsa.</div>
                            ) : (
                              <table style={{width:"100%",fontSize:11}}>
                                <thead><tr><th>Movimiento</th><th>Fecha descarga</th><th>Kg disponibles</th><th>Ubicación</th></tr></thead>
                                <tbody>
                                  {camionesDisponibles.map(c=>(
                                    <tr key={c.id}>
                                      <td className="mono">{c.numero_movimiento}</td>
                                      <td>{c.fecha_descarga ? formatFechaAR(c.fecha_descarga) : "—"}</td>
                                      <td className="mono">{Number(c.kg_disponible).toLocaleString("es-AR",{maximumFractionDigits:0})}</td>
                                      <td>{c.ubicacion_destino_nombre}</td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            )}
                          </div>
                        </td>
                      </tr>
                    )}
                    {retirando===clave && (
                      <tr>
                        <td colSpan={6} style={{padding:"10px 16px",background:"#0f1117"}}>
                          <div style={{display:"flex",gap:8,alignItems:"end",flexWrap:"wrap"}}>
                            <FF label="Productor">
                              <select value={productorSel} onChange={e=>setProductorSel(e.target.value)}>
                                <option value="">Seleccionar...</option>
                                {contrapartes.map(c=><option key={c.id} value={c.id}>{c.razon_social}</option>)}
                              </select>
                            </FF>
                            <FF label="Toneladas a retirar"><input type="number" value={toneladasRetiro} onChange={e=>setToneladasRetiro(e.target.value)} placeholder={`máx ${b.toneladas_totales}`}/></FF>
                            <FF label="N° 1116RT (si ya lo tramitaste)"><input value={numero1116rt} onChange={e=>setNumero1116rt(e.target.value)} placeholder="Opcional"/></FF>
                            <Btn size="sm" disabled={guardando} onClick={()=>confirmarRetiro(b)}>{guardando?"Guardando...":"Confirmar retiro"}</Btn>
                            <Btn size="sm" variant="ghost" onClick={()=>setRetirando(null)}>Cancelar</Btn>
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
};

// ── COMPONENTE PRODUCCION / MAQUILA ──
const OrdenesProduccion = ({modulo, usuario}) => {
  const [ordenes, setOrdenes] = useState([]);
  const [cargando, setCargando] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [contrapartes, setContrapartes] = useState([]);
  const [especies, setEspecies] = useState([]);
  const [ubicacionesPropias, setUbicacionesPropias] = useState([]);
  const [campanas, setCampanas] = useState([]);
  const [form, setForm] = useState({ id_contraparte:"", id_especie:"", id_campana:"", cantidad_toneladas_pactadas:"", id_ubicacion_origen:"", costo_servicio_produccion:"", observaciones:"" });
  const [guardando, setGuardando] = useState(false);

  const [detalleAbierto, setDetalleAbierto] = useState(null);
  const [salidas, setSalidas] = useState({});
  const [nuevaSalida, setNuevaSalida] = useState({ id_especie:"", cantidad_kg:"", id_ubicacion_destino:"" });

  const cargar = async () => {
    setCargando(true);
    const data = await api.get("/api/contratos?vista=todos");
    setOrdenes((data||[]).filter(c => c.tipo_contrato === "PRODUCCION" && c.modalidad === modulo));
    setCargando(false);
  };

  useEffect(()=>{
    cargar();
    api.get("/api/contrapartes").then(d=>setContrapartes(d||[]));
    api.get("/api/especies").then(d=>setEspecies(d||[]));
    api.get("/api/campanas").then(d=>setCampanas(d||[]));
    api.get("/api/ubicaciones").then(d=>setUbicacionesPropias((d||[]).filter(u=>u.tipo==="PLANTA_PROPIA")));
  },[modulo]);

  const especiesGrano = especies.filter(e=>e.tipo_producto!=="SUBPRODUCTO");
  const especiesSubproducto = especies.filter(e=>e.tipo_producto==="SUBPRODUCTO");

  const crearOrden = async () => {
    if(!form.id_contraparte||!form.id_especie||!form.id_campana||!form.cantidad_toneladas_pactadas){
      alert("Completá procesador, especie, campaña y toneladas"); return;
    }
    setGuardando(true);
    try {
      await api.post("/api/contratos", {
        tipo_contrato:"PRODUCCION", modalidad: modulo,
        fecha_contrato: new Date().toISOString().split("T")[0],
        id_contraparte: parseInt(form.id_contraparte),
        id_especie: parseInt(form.id_especie),
        id_campana: parseInt(form.id_campana),
        cantidad_toneladas_pactadas: parseFloat(form.cantidad_toneladas_pactadas),
        tipo_precio: "FIJO", precio_pactado: 0, moneda: "ARS", tipo_entrega:"A_RETIRAR",
        id_ubicacion_origen: form.id_ubicacion_origen || null,
        costo_servicio_produccion: form.costo_servicio_produccion ? parseFloat(form.costo_servicio_produccion) : 0,
        observaciones: form.observaciones || null
      });
      alert("✓ Orden de producción creada");
      setShowForm(false);
      setForm({ id_contraparte:"", id_especie:"", id_campana:"", cantidad_toneladas_pactadas:"", id_ubicacion_origen:"", costo_servicio_produccion:"", observaciones:"" });
      cargar();
    } catch(e){ alert("Error: "+e.message); }
    finally{ setGuardando(false); }
  };

  const cargarSalidas = async (idOrden) => {
    const data = await api.get(`/api/contratos/${idOrden}/salidas`);
    setSalidas(prev=>({...prev, [idOrden]: data||[]}));
  };

  const agregarSalida = async (idOrden) => {
    if(!nuevaSalida.id_especie||!nuevaSalida.cantidad_kg){ alert("Completá producto y kilos"); return; }
    try {
      await api.post(`/api/contratos/${idOrden}/salidas`, {
        id_especie: parseInt(nuevaSalida.id_especie),
        cantidad_kg: parseFloat(nuevaSalida.cantidad_kg),
        id_ubicacion_destino: nuevaSalida.id_ubicacion_destino || null
      });
      setNuevaSalida({ id_especie:"", cantidad_kg:"", id_ubicacion_destino:"" });
      cargarSalidas(idOrden);
    } catch(e){ alert("Error: "+e.message); }
  };

  const cerrarOrden = async (idOrden) => {
    if(!confirm("¿Cerrar la orden? Se va a repartir el costo entre las salidas cargadas y sumarse al Stock. No se puede deshacer.")) return;
    try {
      const r = await api.post(`/api/contratos/${idOrden}/cerrar`, {});
      const metodo = r.reparto_por === "valor_de_mercado" ? "por valor de mercado de cada producto" : "por peso (faltó cargar algún precio de referencia, revisá Configuración → Precios)";
      alert(`✓ Orden cerrada. Costo total repartido ${metodo}: $ ${Number(r.costo_total_pool).toLocaleString("es-AR")}`);
      cargar();
      cargarSalidas(idOrden);
    } catch(e){ alert("Error: "+e.message); }
  };

  return (
    <div className="fade-in">
      <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <h2 style={{fontSize:18,fontWeight:700}}>Producción (Maquila)</h2>
          <p style={{color:"#8890a8",fontSize:13,marginTop:2}}>Grano que mandás a moler/extraer a un tercero, y lo que te devuelve (aceite, expeller, afrechillo...).</p>
        </div>
        <Btn onClick={()=>setShowForm(true)}>+ Nueva Orden</Btn>
      </div>

      <CalculadoraCapacidadPago/>

      {showForm && (
        <Modal title="Nueva Orden de Producción" onClose={()=>setShowForm(false)} footer={
          <Btn disabled={guardando} onClick={crearOrden}>{guardando?"Guardando...":"Crear Orden"}</Btn>
        }>
          <FF label="Procesador *">
            <select value={form.id_contraparte} onChange={e=>setForm({...form,id_contraparte:e.target.value})}>
              <option value="">Seleccionar...</option>
              {contrapartes.map(c=><option key={c.id} value={c.id}>{c.razon_social}</option>)}
            </select>
          </FF>
          <FF label="Grano que mandás *">
            <select value={form.id_especie} onChange={e=>setForm({...form,id_especie:e.target.value})}>
              <option value="">Seleccionar...</option>
              {especiesGrano.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select>
          </FF>
          <FF label="Campaña *">
            <select value={form.id_campana} onChange={e=>setForm({...form,id_campana:e.target.value})}>
              <option value="">Seleccionar...</option>
              {campanas.map(c=><option key={c.id} value={c.id}>{c.descripcion}</option>)}
            </select>
          </FF>
          <FF label="Toneladas que mandás *"><input type="number" value={form.cantidad_toneladas_pactadas} onChange={e=>setForm({...form,cantidad_toneladas_pactadas:e.target.value})}/></FF>
          <FF label="¿Sale de un depósito propio?">
            <select value={form.id_ubicacion_origen} onChange={e=>setForm({...form,id_ubicacion_origen:e.target.value})}>
              <option value="">No descontar de Stock</option>
              {ubicacionesPropias.map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}
            </select>
          </FF>
          <FF label="Costo del servicio de transformación (si te cobran)"><input type="number" value={form.costo_servicio_produccion} onChange={e=>setForm({...form,costo_servicio_produccion:e.target.value})}/></FF>
          <FF label="Observaciones"><input value={form.observaciones} onChange={e=>setForm({...form,observaciones:e.target.value})}/></FF>
        </Modal>
      )}

      {cargando ? <div>Cargando...</div> : ordenes.length===0 ? (
        <div style={{padding:40,textAlign:"center",color:"#8890a8"}}>No hay órdenes de producción todavía.</div>
      ) : (
        ordenes.map(o=>(
          <div key={o.id} className="card" style={{marginBottom:14}}>
            <div className="card-header">
              <div>
                <span style={{fontWeight:700}}>{o.numero_contrato}</span>
                <span style={{color:"#8890a8",fontSize:12,marginLeft:12}}>{o.cantidad_toneladas_pactadas} tn enviadas</span>
              </div>
              <Badge label={o.estado} color={o.estado==="CUMPLIDO"?"green":"orange"}/>
            </div>
            <div style={{padding:"12px 16px"}}>
              <Btn variant="secondary" size="sm" onClick={()=>{ if(detalleAbierto===o.id){setDetalleAbierto(null);} else {setDetalleAbierto(o.id); cargarSalidas(o.id);} }}>
                {detalleAbierto===o.id?"Ocultar salidas":"Ver / cargar salidas"}
              </Btn>
              {detalleAbierto===o.id && (
                <div style={{marginTop:12}}>
                  <table>
                    <thead><tr><th>Producto</th><th>Kilos</th><th>Destino</th></tr></thead>
                    <tbody>
                      {(salidas[o.id]||[]).map(s=>(
                        <tr key={s.id}><td>{s.especie_nombre}</td><td className="mono">{Number(s.cantidad_kg).toLocaleString("es-AR")}</td><td>{s.ubicacion_nombre||"—"}</td></tr>
                      ))}
                      {(salidas[o.id]||[]).length===0 && <tr><td colSpan={3} style={{textAlign:"center",color:"#565d7a",padding:12}}>Sin salidas cargadas</td></tr>}
                    </tbody>
                  </table>
                  {o.estado!=="CUMPLIDO" && (
                    <div style={{display:"flex",gap:8,marginTop:12,alignItems:"end",flexWrap:"wrap"}}>
                      <FF label="Producto">
                        <select value={nuevaSalida.id_especie} onChange={e=>setNuevaSalida({...nuevaSalida,id_especie:e.target.value})}>
                          <option value="">Seleccionar...</option>
                          {especiesSubproducto.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}
                        </select>
                      </FF>
                      <FF label="Kilos"><input type="number" value={nuevaSalida.cantidad_kg} onChange={e=>setNuevaSalida({...nuevaSalida,cantidad_kg:e.target.value})}/></FF>
                      <FF label="¿A qué depósito propio?">
                        <select value={nuevaSalida.id_ubicacion_destino} onChange={e=>setNuevaSalida({...nuevaSalida,id_ubicacion_destino:e.target.value})}>
                          <option value="">Seleccionar...</option>
                          {ubicacionesPropias.map(u=><option key={u.id} value={u.id}>{u.nombre}</option>)}
                        </select>
                      </FF>
                      <Btn size="sm" onClick={()=>agregarSalida(o.id)}>+ Agregar</Btn>
                      <Btn size="sm" variant="secondary" onClick={()=>cerrarOrden(o.id)}>Cerrar orden y repartir costo</Btn>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        ))
      )}
    </div>
  );
};

const DerivadosGranarios = ({modulo}) => {
  const vacio={tipo_operacion:"COMPRA",fecha:new Date().toISOString().slice(0,10),id_especie:"",id_contraparte:"",kilos:"",precio:"",moneda:"PESOS",ctg:"",observaciones:""};
  const [items,setItems]=useState([]),[especies,setEspecies]=useState([]),[contrapartes,setContrapartes]=useState([]),[form,setForm]=useState(vacio),[error,setError]=useState(""),[busy,setBusy]=useState(false);
  const cargar=async()=>{try{setItems(await api.get(`/api/derivados?modalidad=${modulo}`)||[]);}catch(e){setError(e.message)}};
  useEffect(()=>{cargar();api.get('/api/especies').then(x=>setEspecies((x||[]).filter(e=>e.tipo_producto==='SUBPRODUCTO')));api.get('/api/contrapartes').then(x=>setContrapartes(x||[]));},[modulo]);
  const guardar=async()=>{setBusy(true);setError("");try{await api.post('/api/derivados',{...form,modalidad:modulo,id_especie:Number(form.id_especie),id_contraparte:form.id_contraparte?Number(form.id_contraparte):null,kilos:Number(form.kilos),precio:form.precio?Number(form.precio):null});setForm(vacio);await cargar();}catch(e){setError(e.message)}finally{setBusy(false)}};
  const crearEspejo=async id=>{try{await api.post(`/api/derivados/${id}/crear-espejo-formal`,{});await cargar();}catch(e){setError(e.message)}};
  const vincularEspejo=async item=>{try{const texto=window.prompt('Buscar por número, CTG, producto o contraparte:','')??null;if(texto===null)return;const candidatos=await api.get(`/api/derivados/buscar-espejo?modalidad=${modulo}&buscar=${encodeURIComponent(texto)}`);if(!candidatos?.length)throw new Error('No se encontraron operaciones disponibles del otro lado.');const detalle=candidatos.map(x=>`${x.id}: ${x.numero_operacion} · ${x.tipo_operacion} · ${x.producto_nombre} · ${Number(x.kilos).toLocaleString('es-AR')} kg`).join('\n');const id=Number(window.prompt(`Elegí el ID a vincular:\n${detalle}`,candidatos[0].id));if(!id)return;await api.put(`/api/derivados/${item.id}/vincular-espejo`,{id_espejo:id});await cargar();}catch(e){setError(e.message)}};
  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}><div><h2 style={{fontSize:18,fontWeight:700}}>Derivados granarios · {modulo}</h2><div style={{fontSize:12,color:"#8890a8"}}>Carga operativa separada de Movimientos. El espejo no duplica stock.</div></div></div>
    {error&&<div style={{padding:10,background:"rgba(231,76,60,.12)",color:"#e74c3c",borderRadius:6,marginBottom:12}}>{error}</div>}
    <div className="card" style={{padding:16,marginBottom:16}}><div style={{display:"grid",gridTemplateColumns:"repeat(4,minmax(140px,1fr))",gap:10}}>
      <FF label="Operación"><select value={form.tipo_operacion} onChange={e=>setForm({...form,tipo_operacion:e.target.value})}><option>COMPRA</option><option>VENTA</option></select></FF>
      <FF label="Fecha"><input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/></FF>
      <FF label="Producto derivado"><select value={form.id_especie} onChange={e=>setForm({...form,id_especie:e.target.value})}><option value="">Seleccionar...</option>{especies.map(x=><option key={x.id} value={x.id}>{x.nombre}</option>)}</select></FF>
      <FF label="Contraparte"><select value={form.id_contraparte} onChange={e=>setForm({...form,id_contraparte:e.target.value})}><option value="">Sin asignar</option>{contrapartes.map(x=><option key={x.id} value={x.id}>{x.razon_social}</option>)}</select></FF>
      <FF label="Kilos"><input type="number" value={form.kilos} onChange={e=>setForm({...form,kilos:e.target.value})}/></FF>
      <FF label="Precio"><input type="number" value={form.precio} onChange={e=>setForm({...form,precio:e.target.value})}/></FF>
      <FF label="CTG / CPEDG"><input value={form.ctg} onChange={e=>setForm({...form,ctg:e.target.value})}/></FF>
      <div style={{display:"flex",alignItems:"end"}}><Btn onClick={guardar} disabled={busy||!form.id_especie||!form.kilos}>{busy?'Guardando...':'Guardar derivado'}</Btn></div>
    </div></div>
    <div className="card"><table><thead><tr><th>Número</th><th>Fecha</th><th>Operación</th><th>Producto real</th><th>Contraparte</th><th>Kilos</th><th>CTG</th><th>Espejo</th><th></th></tr></thead><tbody>
      {items.map(x=><tr key={x.id}><td className="mono">{x.numero_operacion}</td><td>{x.fecha?.slice(0,10)}</td><td><Badge label={x.tipo_operacion} color={x.tipo_operacion==='COMPRA'?'green':'orange'}/></td><td>{x.producto_nombre}</td><td>{x.contraparte_nombre||'—'}</td><td className="mono">{Number(x.kilos).toLocaleString('es-AR')}</td><td className="mono">{x.ctg||'—'}</td><td>{x.espejo_numero||'Sin vincular'}</td><td><div style={{display:'flex',gap:6}}>{modulo==='INFORMAL'&&!x.id_operacion_espejo&&<Btn size="sm" variant="secondary" onClick={()=>crearEspejo(x.id)}>Pasar al formal</Btn>}{!x.id_operacion_espejo&&<Btn size="sm" variant="ghost" onClick={()=>vincularEspejo(x)}>Buscar y vincular</Btn>}</div></td></tr>)}
      {!items.length&&<tr><td colSpan="9" style={{textAlign:"center",padding:24,color:"#565d7a"}}>Sin operaciones de derivados</td></tr>}
    </tbody></table></div>
  </div>;
};
