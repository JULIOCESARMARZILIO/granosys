function Login({onLogin}) {
  const [user,setUser]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");

  const handleLogin = async () => {
    if(!user||!pass){setErr("Ingresá usuario y contraseña");return;}
    try {
      const r = await fetch(`${API_URL}/api/usuarios/login`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ usuario: user, contrasena: pass })
      });
      if (!r.ok) {
        const errText = await r.text();
        let errMsg = "Usuario o contraseña incorrectos";
        try {
          const parsed = JSON.parse(errText);
          if (parsed.error) errMsg = parsed.error;
        } catch(e) {}
        setErr(errMsg);
        return;
      }
      const data = await r.json();
      sessionStorage.setItem("granosys_access_token", data.token);
      onLogin(data.user);
    } catch (e) {
      setErr("Error de conexión con el servidor");
    }
  };

  return (
    <div style={{
      height:"100vh",background:"#0f1117",display:"flex",
      alignItems:"center",justifyContent:"center",flexDirection:"column"
    }}>
      <div style={{
        background:"#1a1d27",border:"1px solid #2a2d3e",borderRadius:12,
        padding:"40px 48px",width:"100%",maxWidth:400,
      }}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:700,fontSize:28,color:"#f5a623",letterSpacing:"-.02em",marginBottom:6}}>
            GRANO<span style={{color:"#e8eaf0"}}>SYS</span>
          </div>
          <div style={{fontSize:13,color:"#565d7a",letterSpacing:".05em",textTransform:"uppercase"}}>Sistema de Comercialización</div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{display:"block",fontSize:11,fontWeight:600,color:"#8890a8",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>Usuario</label>
          <input
            value={user} onChange={e=>setUser(e.target.value)}
            placeholder="Ingresá tu usuario"
            onKeyDown={e=>e.key==="Enter"&&handleLogin()}
            style={{width:"100%",padding:"10px 14px",fontSize:14}}
          />
        </div>
        <div style={{marginBottom:24}}>
          <label style={{display:"block",fontSize:11,fontWeight:600,color:"#8890a8",textTransform:"uppercase",letterSpacing:".06em",marginBottom:5}}>Contraseña</label>
          <input
            type="password" value={pass} onChange={e=>setPass(e.target.value)}
            placeholder="••••••••"
            onKeyDown={e=>e.key==="Enter"&&handleLogin()}
            style={{width:"100%",padding:"10px 14px",fontSize:14}}
          />
        </div>
        {err&&<div style={{padding:"8px 12px",background:"rgba(231,76,60,.1)",border:"1px solid rgba(231,76,60,.3)",borderRadius:6,color:"#e74c3c",fontSize:13,marginBottom:16}}>{err}</div>}
        <button onClick={handleLogin} style={{
          width:"100%",padding:"11px",background:"#f5a623",color:"#000",
          fontWeight:700,fontSize:15,border:"none",borderRadius:8,cursor:"pointer"
        }}>
          Ingresar
        </button>
        <div style={{marginTop:20,textAlign:"center",fontSize:11,color:"#565d7a"}}>
          v2.7.14 — GranoSYS - INVDELSAL</div>
      </div>
    </div>
  );
}

// ── COMPONENTE AGENTE IA ──
const AgenteIA = ({ modulo, usuario }) => {
  const [messages, setMessages] = useState([
    {
      role: 'assistant',
      text: '¡Hola! Soy tu Agente IA Granosys. Puedo consultar contratos, stock de granos, movimientos de camiones, cuenta corriente y proponer acciones que requieran tu aprobación. ¿En qué puedo ayudarte hoy?'
    }
  ]);
  const [inputValue, setInputValue] = useState('');
  const [thinking, setThinking] = useState(false);
  const [proposals, setProposals] = useState([]);
  const [proposalTab, setProposalTab] = useState('PENDIENTE');
  const chatEndRef = useRef(null);

  const loadProposals = async (tab = proposalTab) => {
    try {
      const res = await api.get(`/api/agent/proposals?estado=${tab}`);
      setProposals(res);
    } catch (err) {
      console.error('Error al cargar propuestas:', err);
    }
  };

  useEffect(() => {
    loadProposals();
  }, [proposalTab]);

  useEffect(() => {
    chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, thinking]);

  const handleSend = async (e) => {
    if (e) e.preventDefault();
    if (!inputValue.trim()) return;

    const userText = inputValue;
    setInputValue('');
    setMessages(prev => [...prev, { role: 'user', text: userText }]);
    setThinking(true);

    try {
      // Format history
      const history = messages.slice(1).map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        text: m.text
      }));

      const res = await api.post('/api/agent/chat', {
        message: userText,
        history
      });

      if (!res) {
        setMessages(prev => [...prev, { role: 'assistant', text: '❌ No se pudo conectar con el agente. Intentá de nuevo en un momento.' }]);
      } else {
        setMessages(prev => [...prev, { role: 'assistant', text: res.text, data: (res.data && res.data.length > 0) ? res.data : null }]);
        if (res.proposal) {
          loadProposals();
        }
      }
    } catch (err) {
      setMessages(prev => [...prev, { role: 'assistant', text: `❌ Error al conectar con el agente: ${err.response?.data?.error || err.message}` }]);
    } finally {
      setThinking(false);
    }
  };

  // Exporta a Excel el resultado tabular (crudo, sin markdown) de la
  // ultima consulta que el agente haya hecho para armar ese mensaje.
  const exportarAExcel = (data) => {
    if (!data || data.length === 0) return;
    const worksheet = XLSX.utils.json_to_sheet(data);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Agente IA");
    const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `agente_ia_${new Date().toISOString().slice(0,10)}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const exportarAPDF = (data) => {
    if (!data || data.length === 0) return;
    const { jsPDF } = window.jspdf;
    const columnas = Object.keys(data[0]);
    const doc = new jsPDF({ orientation: 'landscape' });
    doc.setFontSize(11);
    doc.text('GranoSYS — Agente IA', 14, 10);
    doc.autoTable({
      head: [columnas],
      body: data.map(row => columnas.map(c => {
        const val = row[c];
        return val === null || val === undefined ? '' : String(val);
      })),
      startY: 16,
      styles: { fontSize: 6, cellPadding: 1.5 },
      headStyles: { fillColor: [245, 166, 35] }
    });
    doc.save(`agente_ia_${new Date().toISOString().slice(0,10)}.pdf`);
  };

  const handleApprove = async (id) => {
    try {
      const res = await api.post(`/api/agent/proposals/${id}/approve`, {
        usuario_aprobador: usuario
      });
      alert('✓ Propuesta aprobada y ejecutada en la base de datos con éxito.');
      loadProposals();
      setMessages(prev => [...prev, { role: 'assistant', text: `✅ He aprobado la propuesta ID #${id} en el sistema. Los cambios ya están reflejados en la base de datos.` }]);
    } catch (err) {
      alert('Error al aprobar propuesta: ' + (err.response?.data?.error || err.message));
    }
  };

  const handleReject = async (id) => {
    if (!confirm('¿Seguro que deseas rechazar esta propuesta?')) return;
    try {
      await api.post(`/api/agent/proposals/${id}/reject`, {
        usuario_aprobador: usuario
      });
      loadProposals();
      setMessages(prev => [...prev, { role: 'assistant', text: `❌ He rechazado la propuesta ID #${id}. No se realizaron cambios.` }]);
    } catch (err) {
      alert('Error al rechazar propuesta: ' + (err.response?.data?.error || err.message));
    }
  };

  const formatProposalData = (datos) => {
    if (!datos) return null;
    return (
      <table style={{ width: '100%', fontSize: 11, borderCollapse: 'collapse', marginTop: 8 }}>
        <tbody>
          {Object.entries(datos).map(([key, val]) => {
            if (key === 'explicacion') return null;
            let displayVal = val;
            if (Array.isArray(val)) {
              displayVal = val.join(', ');
            } else if (typeof val === 'object' && val !== null) {
              displayVal = JSON.stringify(val);
            }
            return (
              <tr key={key} style={{ borderBottom: '1px solid #2a2d3e' }}>
                <td style={{ padding: '4px 8px', fontWeight: 600, color: '#f5a623', width: '35%' }}>{key}</td>
                <td style={{ padding: '4px 8px', color: '#e8eaf0' }}>{String(displayVal)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
    );
  };

  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 20, height: 'calc(100vh - 120px)', overflow: 'hidden' }}>
      {/* COLUMN 1: CHAT */}
      <div style={{ background: '#1a1d27', border: '1px solid #2a2d3e', borderRadius: 10, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
        <div style={{ padding: '14px 16px', borderBottom: '1px solid #2a2d3e', background: '#151821', display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ width: 10, height: 10, borderRadius: '50%', background: '#2ecc71', boxShadow: '0 0 8px #2ecc71' }}></div>
          <span style={{ fontSize: 13, fontWeight: 700, color: '#e8eaf0' }}>Copiloto IA Activo</span>
        </div>

        {/* MESSAGES VIEW */}
        <div style={{ flex: 1, padding: 16, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 14 }}>
          {messages.map((m, idx) => (
            <div key={idx} style={{ display: 'flex', justifyContent: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
              <div style={{
                maxWidth: '85%',
                padding: '10px 14px',
                borderRadius: m.role === 'user' ? '12px 12px 2px 12px' : '12px 12px 12px 2px',
                background: m.role === 'user' ? '#f5a623' : '#0f1117',
                color: m.role === 'user' ? '#1a1d27' : '#e8eaf0',
                border: m.role === 'user' ? 'none' : '1px solid #2a2d3e',
                fontSize: 12.5,
                lineHeight: 1.5,
                whiteSpace: 'pre-wrap',
                boxShadow: '0 2px 5px rgba(0,0,0,0.15)'
              }}>
                {m.text}
                {m.data && m.data.length > 0 && (
                  <div style={{marginTop:8,display:"flex",gap:6}}>
                    <Btn size="sm" variant="secondary" onClick={()=>exportarAExcel(m.data)}>📥 Excel ({m.data.length})</Btn>
                    <Btn size="sm" variant="secondary" onClick={()=>exportarAPDF(m.data)}>📄 PDF</Btn>
                  </div>
                )}
              </div>
            </div>
          ))}
          {thinking && (
            <div style={{ display: 'flex', justifyContent: 'flex-start' }}>
              <div style={{
                padding: '10px 14px',
                borderRadius: '12px 12px 12px 2px',
                background: '#0f1117',
                border: '1px solid #2a2d3e',
                color: '#8890a8',
                fontSize: 12,
                display: 'flex',
                alignItems: 'center',
                gap: 8
              }}>
                <span className="loading-spinner" style={{ display: 'inline-block', width: 12, height: 12, border: '2px solid #f5a623', borderTopColor: 'transparent', borderRadius: '50%', animation: 'spin 1s linear infinite' }}></span>
                El agente está procesando...
              </div>
            </div>
          )}
          <div ref={chatEndRef}></div>
        </div>

        {/* INPUT INPUT */}
        <form onSubmit={handleSend} style={{ padding: 12, borderTop: '1px solid #2a2d3e', background: '#151821', display: 'flex', gap: 10 }}>
          <input
            type="text"
            value={inputValue}
            onChange={e => setInputValue(e.target.value)}
            placeholder="Pregúntame sobre saldos, stock o proponme cruzar contratos..."
            disabled={thinking}
            style={{
              flex: 1,
              background: '#0f1117',
              border: '1px solid #2a2d3e',
              borderRadius: 6,
              color: '#e8eaf0',
              padding: '10px 14px',
              fontSize: 12.5,
              outline: 'none',
              transition: 'border-color 0.2s'
            }}
          />
          <button
            type="submit"
            disabled={thinking || !inputValue.trim()}
            style={{
              background: '#f5a623',
              color: '#1a1d27',
              border: 'none',
              padding: '0 16px',
              borderRadius: 6,
              fontSize: 12.5,
              fontWeight: 700,
              cursor: 'pointer',
              opacity: (thinking || !inputValue.trim()) ? 0.6 : 1,
              transition: 'background-color 0.2s'
            }}
          >
            Enviar
          </button>
        </form>
      </div>

      {/* COLUMN 2: PROPOSALS */}
      <div style={{ background: '#1a1d27', border: '1px solid #2a2d3e', borderRadius: 10, display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
        <div style={{ padding: '12px 16px', borderBottom: '1px solid #2a2d3e', background: '#151821', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: '#e8eaf0' }}>Bandeja de Aprobación Humana</span>
          <div style={{ display: 'flex', gap: 4 }}>
            {['PENDIENTE', 'APROBADO', 'RECHAZADO'].map(t => (
              <button
                key={t}
                onClick={() => setProposalTab(t)}
                style={{
                  padding: '4px 8px',
                  fontSize: 10,
                  fontWeight: 600,
                  borderRadius: 4,
                  border: 'none',
                  background: proposalTab === t ? '#2a2d3e' : 'transparent',
                  color: proposalTab === t ? '#f5a623' : '#8890a8',
                  cursor: 'pointer'
                }}
              >
                {t}
              </button>
            ))}
          </div>
        </div>

        {/* PROPOSALS LIST */}
        <div style={{ flex: 1, padding: 16, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 12 }}>
          {proposals.length === 0 ? (
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '100%', color: '#565d7a', gap: 8 }}>
              <span style={{ fontSize: 24 }}>📭</span>
              <span style={{ fontSize: 12 }}>No hay propuestas en esta bandeja.</span>
            </div>
          ) : (
            proposals.map(p => (
              <div key={p.id} style={{
                background: '#0f1117',
                border: '1px solid #2a2d3e',
                borderRadius: 8,
                padding: 14,
                display: 'flex',
                flexDirection: 'column',
                gap: 8,
                transition: 'all 0.2s'
              }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', borderBottom: '1px solid #2a2d3e', paddingBottom: 6 }}>
                  <span style={{
                    fontSize: 11,
                    fontWeight: 700,
                    color: p.tipo_accion.includes('LIQUIDACION') ? '#2ecc71' : (p.tipo_accion.includes('CONTRATO') ? '#3498db' : '#f1c40f'),
                    textTransform: 'uppercase',
                    letterSpacing: '.04em'
                  }}>
                    {p.tipo_accion.replace(/_/g, ' ')}
                  </span>
                  <span style={{ fontSize: 10, color: '#565d7a' }}>ID #{p.id}</span>
                </div>

                {p.explicacion && (
                  <div style={{ fontSize: 11.5, color: '#8890a8', fontStyle: 'italic', background: 'rgba(255,255,255,0.01)', padding: '6px 10px', borderRadius: 4, borderLeft: '3px solid #f5a623' }}>
                    <strong>Explicación:</strong> {p.explicacion}
                  </div>
                )}

                {formatProposalData(p.datos_propuesta)}

                {p.estado === 'PENDIENTE' && (
                  <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end', marginTop: 10 }}>
                    <button
                      onClick={() => handleReject(p.id)}
                      style={{
                        padding: '6px 12px',
                        fontSize: 11,
                        fontWeight: 600,
                        borderRadius: 6,
                        border: '1px solid #c0392b44',
                        background: 'transparent',
                        color: '#e74c3c',
                        cursor: 'pointer',
                        transition: 'all 0.2s'
                      }}
                    >
                      Rechazar ❌
                    </button>
                    <button
                      onClick={() => handleApprove(p.id)}
                      style={{
                        padding: '6px 14px',
                        fontSize: 11,
                        fontWeight: 700,
                        borderRadius: 6,
                        border: 'none',
                        background: '#2ecc71',
                        color: '#1a1d27',
                        cursor: 'pointer',
                        transition: 'all 0.2s'
                      }}
                    >
                      Aprobar y Ejecutar ✅
                    </button>
                  </div>
                )}

                {p.estado !== 'PENDIENTE' && (
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: '#565d7a', marginTop: 4, paddingTop: 4, borderTop: '1px dotted #2a2d3e' }}>
                    <span>Aprobador: <strong>{p.usuario_aprobador || 'N/A'}</strong></span>
                    <span>Fecha: {new Date(p.fecha_aprobacion).toLocaleString()}</span>
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      </div>
    </div>
  );
};

// ── COMPONENTE REPORTES IA ──
const ReportesIA = ({modulo, usuario}) => {
  const [titulo, setTitulo] = useState("");
  const [prompt, setPrompt] = useState("");
  const [sqlQuery, setSqlQuery] = useState("");
  const [columnas, setColumnas] = useState([]);
  const [filas, setFilas] = useState([]);
  const [multitabla, setMultitabla] = useState(false);
  const [tablas, setTablas] = useState([]);
  const [historial, setHistorial] = useState([]);
  const [cargando, setCargando] = useState(false);
  const [filtros, setFiltros] = useState([]);
  const [columnaSeleccionada, setColumnaSeleccionada] = useState("");
  
  // Controles del nuevo filtro a agregar
  const [filtroMinVal, setFiltroMinVal] = useState("");
  const [filtroMaxVal, setFiltroMaxVal] = useState("");
  const [filtroMinDate, setFiltroMinDate] = useState("");
  const [filtroMaxDate, setFiltroMaxDate] = useState("");
  const [filtroValoresSeleccionados, setFiltroValoresSeleccionados] = useState([]);

  useEffect(() => {
    cargarHistorial();
  }, []);

  const cargarHistorial = async () => {
    try {
      const data = await api.get("/api/reportes/ia");
      setHistorial(data || []);
    } catch (e) {
      console.error(e);
    }
  };

  const generarReporte = async () => {
    if (!prompt.trim()) return alert("Ingresá un prompt para pedirle a la IA");
    setCargando(true);
    setFiltros([]); // Limpiar filtros al generar nueva consulta
    try {
      const res = await api.post("/api/reportes/generar-ia", { prompt, modalidad: modulo });
      if (res) {
        setSqlQuery(res.sql || "");
        if (res.multitabla) {
          setMultitabla(true);
          setTablas(res.tablas || []);
          setColumnas(res.tablas[0]?.columnas || []);
          setFilas(res.tablas[0]?.filas || []);
        } else {
          setMultitabla(false);
          setTablas([]);
          setColumnas(res.columnas || []);
          setFilas(res.filas || []);
        }
        if (!titulo) {
          setTitulo(`Reporte: ${prompt.substring(0, 30)}${prompt.length > 30 ? "..." : ""}`);
        }
      }
    } catch (e) {
      alert("Error al generar reporte: " + e.message);
    } finally {
      setCargando(false);
    }
  };

  const guardarReporte = async () => {
    if (!titulo.trim()) return alert("Ingresá un título para el reporte");
    if (!sqlQuery) return alert("Generá un reporte antes de guardarlo");
    try {
      await api.post("/api/reportes/ia", {
        titulo,
        prompt,
        sql_query: sqlQuery,
        columnas
      });
      alert("✓ Reporte guardado exitosamente");
      cargarHistorial();
    } catch (e) {
      alert("Error al guardar: " + e.message);
    }
  };

  const cargarReporteGuardado = async (id) => {
    setCargando(true);
    setFiltros([]);
    try {
      const res = await api.get(`/api/reportes/ia/${id}`);
      if (res) {
        setTitulo(res.titulo);
        setPrompt(res.prompt);
        setSqlQuery(res.sql_query);
        if (res.multitabla) {
          setMultitabla(true);
          setTablas(res.tablas || []);
          setColumnas(res.tablas[0]?.columnas || []);
          setFilas(res.tablas[0]?.filas || []);
        } else {
          setMultitabla(false);
          setTablas([]);
          setColumnas(res.columnas || []);
          setFilas(res.filas || []);
        }
      }
    } catch (e) {
      alert("Error al cargar reporte: " + e.message);
    } finally {
      setCargando(false);
    }
  };

  const getColumnaTipo = (col) => {
    const colLower = col.toLowerCase();
    if (colLower.includes("fecha") || colLower.includes("vencimiento") || colLower.includes("creación")) return "date-range";
    if (colLower.includes("neto") || colLower.includes("tara") || colLower.includes("bruto") || colLower.includes("faltante") || colLower.includes("kg") || colLower.includes("toneladas") || colLower.includes("precio") || colLower.includes("monto") || colLower.includes("tarifa") || colLower.includes("km") || colLower.includes("factor") || colLower.includes("humedad") || colLower.includes("descuento")) {
      return "number-range";
    }
    for (let r of filas) {
      const val = r[col];
      if (val !== null && val !== undefined) {
        if (typeof val === "number") return "number-range";
        if (typeof val === "string") {
          if (/^\d{4}-\d{2}-\d{2}/.test(val) || /^\d{2}\/\d{2}\/\d{4}/.test(val)) return "date-range";
        }
      }
    }
    return "multiselect";
  };

  // Obtener valores únicos de una columna
  const getValoresUnicos = (col) => {
    const vals = new Set();
    filas.forEach(r => {
      const val = r[col];
      if (val !== null && val !== undefined && val !== "") {
        vals.add(String(val));
      }
    });
    return Array.from(vals).sort();
  };

  const agregarFiltro = () => {
    if (!columnaSeleccionada) return;
    
    // Verificar si ya existe filtro para esta columna
    if (filtros.some(f => f.columna === columnaSeleccionada)) {
      alert("Ya existe un filtro activo para la columna " + columnaSeleccionada);
      return;
    }

    const tipo = getColumnaTipo(columnaSeleccionada);
    
    const nuevoFiltro = {
      columna: columnaSeleccionada,
      tipo,
      minVal: filtroMinVal,
      maxVal: filtroMaxVal,
      minDate: filtroMinDate,
      maxDate: filtroMaxDate,
      selectedValues: [...filtroValoresSeleccionados]
    };

    setFiltros([...filtros, nuevoFiltro]);
    
    // Resetear campos
    setColumnaSeleccionada("");
    setFiltroMinVal("");
    setFiltroMaxVal("");
    setFiltroMinDate("");
    setFiltroMaxDate("");
    setFiltroValoresSeleccionados([]);
  };

  const removerFiltro = (index) => {
    setFiltros(filtros.filter((_, i) => i !== index));
  };

  // Aplicar filtros a las filas
  const filasFiltradas = filas.filter(row => {
    return filtros.every(f => {
      const val = row[f.columna];
      if (f.tipo === "date-range") {
        if (!val) return false;
        const dVal = new Date(val).getTime();
        if (f.minDate && new Date(f.minDate).getTime() > dVal) return false;
        if (f.maxDate && new Date(f.maxDate).getTime() < dVal) return false;
        return true;
      }
      if (f.tipo === "number-range") {
        const nVal = parseFloat(val);
        if (isNaN(nVal)) return false;
        if (f.minVal !== "" && f.minVal !== null && parseFloat(f.minVal) > nVal) return false;
        if (f.maxVal !== "" && f.maxVal !== null && parseFloat(f.maxVal) < nVal) return false;
        return true;
      }
      if (f.tipo === "multiselect") {
        if (f.selectedValues.length === 0) return true;
        return f.selectedValues.includes(String(val));
      }
      return true;
    });
  });

  // Exportar a Excel
  const exportarExcel = () => {
    let worksheet;
    const workbook = XLSX.utils.book_new();

    if (multitabla) {
      const aoa = [];
      tablas.forEach((tbl) => {
        // Título de la tabla
        aoa.push([tbl.titulo.toUpperCase()]);
        // Columnas
        aoa.push(tbl.columnas);
        // Filas
        tbl.filas.forEach((row) => {
          const rowData = tbl.columnas.map(col => {
            const val = row[col];
            return val !== null && val !== undefined ? val : "";
          });
          aoa.push(rowData);
        });
        // Separador
        aoa.push([]);
        aoa.push([]);
      });
      worksheet = XLSX.utils.aoa_to_sheet(aoa);
      XLSX.utils.book_append_sheet(workbook, worksheet, "Resumen Contratos");
    } else {
      if (filasFiltradas.length === 0) return alert("No hay datos para exportar");
      
      const dataToExport = filasFiltradas.map(row => {
        const obj = {};
        // ID del movimiento obligatoriamente en la primera columna para cruzamientos
        obj["ID Movimiento"] = row.id || row.ID || "";
        
        // Mapear el resto de las columnas del reporte de IA
        columnas.forEach(col => {
          if (col.toLowerCase() !== "id") {
            obj[col] = row[col] !== null && row[col] !== undefined ? row[col] : "";
          }
        });
        return obj;
      });

      worksheet = XLSX.utils.json_to_sheet(dataToExport);
      XLSX.utils.book_append_sheet(workbook, worksheet, "Reporte IA");
    }
    
    const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
    const blob = new Blob([wbout], { type: 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${titulo.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'reporte_ia'}.xlsx`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div className="fade-in" style={{paddingBottom: 40}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div>
          <h2 style={{fontSize:20,fontWeight:700}}>🤖 Generador de Reportes con IA</h2>
          <p style={{color:"#8890a8",fontSize:13,marginTop:2}}>Pedile al sistema en lenguaje natural qué información querés ver y la IA generará la consulta SQL correspondiente.</p>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"260px 1fr",gap:20,alignItems:"start"}}>
        {/* HISTORIAL / LATERAL */}
        <div className="card" style={{padding:"16px 18px"}}>
          <div style={{fontWeight:600,fontSize:13,color:"#f5a623",textTransform:"uppercase",letterSpacing:".05em",marginBottom:14,borderBottom:"1px solid #2a2d3e",paddingBottom:8}}>
            📋 Reportes Guardados
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8,maxHeight:450,overflowY:"auto"}}>
            {historial.length === 0 ? (
              <div style={{fontSize:12,color:"#565d7a",textAlign:"center",padding:"10px 0"}}>No hay reportes guardados aún.</div>
            ) : (
              historial.map(h => (
                <button
                  key={h.id}
                  onClick={() => cargarReporteGuardado(h.id)}
                  style={{
                    background: "rgba(255,255,255,.02)",
                    border: "1px solid #2a2d3e",
                    borderRadius: 6,
                    padding: "8px 10px",
                    textAlign: "left",
                    cursor: "pointer",
                    transition: "all .2s"
                  }}
                  onMouseEnter={e => e.target.style.background = "rgba(255,255,255,.05)"}
                  onMouseLeave={e => e.target.style.background = "rgba(255,255,255,.02)"}
                >
                  <div style={{fontSize:12,fontWeight:600,color:"#e8eaf0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.titulo}</div>
                  <div style={{fontSize:10,color:"#565d7a",marginTop:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.prompt}</div>
                </button>
              ))
            )}
          </div>
        </div>

        {/* CONTENIDO PRINCIPAL */}
        <div style={{display:"flex",flexDirection:"column",gap:20}}>
          {/* FORMULARIO DE CONSULTA */}
          <div className="card" style={{padding:20}}>
            <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:16,marginBottom:16}}>
              <FF label="Título del Reporte">
                <input
                  type="text"
                  placeholder="Ej: Reporte de Movimientos de Soja de la campaña 24/25"
                  value={titulo}
                  onChange={e => setTitulo(e.target.value)}
                />
              </FF>
              <FF label="Modalidad Actual">
                <input readOnly value={modulo === "CONSOLIDADO" ? "Consolidado" : modulo === "FORMAL" ? "📋 Formal" : "📝 Informal"} style={{background:"rgba(255,255,255,.02)",color:"#8890a8"}}/>
              </FF>
            </div>
            
            <FF label="¿Qué información querés ver? (Pedile a la IA en lenguaje natural)">
              <textarea
                placeholder="Ej: Mostrame todos los movimientos de soja en tránsito de la campaña 24/25 filtrados por productor García"
                value={prompt}
                onChange={e => setPrompt(e.target.value)}
                style={{
                  width: "100%",
                  height: 70,
                  padding: "10px 14px",
                  fontSize: 13,
                  background: "#0f1117",
                  border: "1px solid #2a2d3e",
                  borderRadius: 6,
                  color: "#e8eaf0",
                  resize: "none"
                }}
              />
            </FF>

            <div style={{display:"flex",justifyContent:"flex-end",gap:10,marginTop:16}}>
              {sqlQuery && (
                <button
                  onClick={guardarReporte}
                  style={{
                    padding: "8px 16px",
                    background: "transparent",
                    color: "#f5a623",
                    border: "1px solid #f5a623",
                    borderRadius: 6,
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer"
                  }}
                >
                  💾 Guardar Reporte
                </button>
              )}
              <button
                onClick={generarReporte}
                disabled={cargando}
                style={{
                  padding: "8px 18px",
                  background: "#f5a623",
                  color: "#000",
                  border: "none",
                  borderRadius: 6,
                  fontSize: 13,
                  fontWeight: 700,
                  cursor: "pointer",
                  opacity: cargando ? 0.7 : 1
                }}
              >
                {cargando ? "Generando consulta..." : "🔍 Consultar IA"}
              </button>
            </div>
          </div>

          {/* VISOR SQL */}
          {sqlQuery && (
            <div className="card" style={{padding:"14px 18px",background:"#0a0b0f",border:"1px solid #1a1d27"}}>
              <div style={{fontSize:11,fontWeight:700,color:"#565d7a",textTransform:"uppercase",marginBottom:6}}>
                🖥️ Consulta SQL Generada
              </div>
              <pre style={{
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 12,
                color: "#8890a8",
                overflowX: "auto",
                whiteSpace: "pre-wrap",
                margin: 0,
                background: "rgba(0,0,0,.2)",
                padding: "8px 10px",
                borderRadius: 4
              }}>
                {sqlQuery}
              </pre>
            </div>
          )}

          {/* GRILLA DE RESULTADOS Y FILTROS */}
          {filas.length > 0 ? (
            <div className="card" style={{padding:20}}>
              {/* PANEL DE FILTROS */}
              <div style={{marginBottom:18,borderBottom:"1px solid #2a2d3e",paddingBottom:16}}>
                <div style={{fontWeight:600,fontSize:14,color:"#e8eaf0",marginBottom:12}}>
                  🛠️ Filtros de Reporte Avanzados
                </div>
                
                {/* FILTROS ACTIVOS */}
                {filtros.length > 0 && (
                  <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
                    {filtros.map((f, idx) => (
                      <div
                        key={idx}
                        style={{
                          background: "rgba(245,166,35,.12)",
                          border: "1px solid rgba(245,166,35,.3)",
                          color: "#f5a623",
                          borderRadius: 6,
                          padding: "4px 10px",
                          fontSize: 11,
                          display: "flex",
                          alignItems: "center",
                          gap: 6
                        }}
                      >
                        <span>
                          <strong>{f.columna}:</strong>{" "}
                          {f.tipo === "multiselect"
                            ? f.selectedValues.join(", ")
                            : f.tipo === "number-range"
                            ? `${f.minVal || "Min"} - ${f.maxVal || "Max"}`
                            : `${f.minDate || "Min"} a ${f.maxDate || "Max"}`
                          }
                        </span>
                        <button
                          onClick={() => removerFiltro(idx)}
                          style={{
                            background: "none",
                            border: "none",
                            color: "#f5a623",
                            fontSize: 14,
                            cursor: "pointer",
                            padding: "0 2px"
                          }}
                        >
                          ×
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {/* AGREGAR FILTRO FORM */}
                <div style={{display:"flex",alignItems:"end",gap:12,flexWrap:"wrap",background:"rgba(255,255,255,.02)",padding:"12px 14px",borderRadius:6,border:"1px solid #2a2d3e"}}>
                  <div style={{minWidth:160}}>
                    <label style={{display:"block",fontSize:10,color:"#8890a8",marginBottom:5,textTransform:"uppercase"}}>Columna</label>
                    <select
                      value={columnaSeleccionada}
                      onChange={e => {
                        setColumnaSeleccionada(e.target.value);
                        setFiltroMinVal("");
                        setFiltroMaxVal("");
                        setFiltroMinDate("");
                        setFiltroMaxDate("");
                        setFiltroValoresSeleccionados([]);
                      }}
                      style={{width:"100%"}}
                    >
                      <option value="">Seleccionar...</option>
                      {columnas.map(c => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>

                  {columnaSeleccionada && (() => {
                    const tipo = getColumnaTipo(columnaSeleccionada);
                    if (tipo === "number-range") {
                      return (
                        <>
                          <div>
                            <label style={{display:"block",fontSize:10,color:"#8890a8",marginBottom:5,textTransform:"uppercase"}}>Min</label>
                            <input
                              type="number"
                              value={filtroMinVal}
                              onChange={e => setFiltroMinVal(e.target.value)}
                              style={{width:100}}
                            />
                          </div>
                          <div>
                            <label style={{display:"block",fontSize:10,color:"#8890a8",marginBottom:5,textTransform:"uppercase"}}>Max</label>
                            <input
                              type="number"
                              value={filtroMaxVal}
                              onChange={e => setFiltroMaxVal(e.target.value)}
                              style={{width:100}}
                            />
                          </div>
                        </>
                      );
                    }
                    if (tipo === "date-range") {
                      return (
                        <>
                          <div>
                            <label style={{display:"block",fontSize:10,color:"#8890a8",marginBottom:5,textTransform:"uppercase"}}>Desde</label>
                            <input
                              type="date"
                              value={filtroMinDate}
                              onChange={e => setFiltroMinDate(e.target.value)}
                              style={{width:130}}
                            />
                          </div>
                          <div>
                            <label style={{display:"block",fontSize:10,color:"#8890a8",marginBottom:5,textTransform:"uppercase"}}>Hasta</label>
                            <input
                              type="date"
                              value={filtroMaxDate}
                              onChange={e => setFiltroMaxDate(e.target.value)}
                              style={{width:130}}
                            />
                          </div>
                        </>
                      );
                    }
                    if (tipo === "multiselect") {
                      const unicos = getValoresUnicos(columnaSeleccionada);
                      return (
                        <div style={{minWidth:200}}>
                          <label style={{display:"block",fontSize:10,color:"#8890a8",marginBottom:5,textTransform:"uppercase"}}>Valores</label>
                          <div style={{
                            maxHeight:110,
                            overflowY:"auto",
                            background:"#0f1117",
                            border:"1px solid #2a2d3e",
                            borderRadius:6,
                            padding:"6px 10px",
                            display:"flex",
                            flexDirection:"column",
                            gap:4
                          }}>
                            {unicos.map(val => (
                              <label key={val} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,cursor:"pointer"}}>
                                <input
                                  type="checkbox"
                                  checked={filtroValoresSeleccionados.includes(val)}
                                  onChange={e => {
                                    if (e.target.checked) {
                                      setFiltroValoresSeleccionados([...filtroValoresSeleccionados, val]);
                                    } else {
                                      setFiltroValoresSeleccionados(filtroValoresSeleccionados.filter(v => v !== val));
                                    }
                                  }}
                                />
                                {val}
                              </label>
                            ))}
                          </div>
                        </div>
                      );
                    }
                    return null;
                  })()}

                  {columnaSeleccionada && (
                    <button
                      onClick={agregarFiltro}
                      style={{
                        padding: "8px 14px",
                        background: "#3498db",
                        color: "#fff",
                        border: "none",
                        borderRadius: 6,
                        fontWeight: 600,
                        fontSize: 12,
                        cursor: "pointer"
                      }}
                    >
                      + Aplicar Filtro
                    </button>
                  )}
                </div>
              </div>

              {/* CONTROLES EXPORTACION */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                <div style={{fontSize:13,color:"#8890a8"}}>
                  Mostrando <strong>{filasFiltradas.length}</strong> de {filas.length} filas
                </div>
                <button
                  onClick={exportarExcel}
                  style={{
                    padding: "7px 14px",
                    background: "rgba(39,174,96,.12)",
                    color: "#27ae60",
                    border: "1px solid rgba(39,174,96,.3)",
                    borderRadius: 6,
                    fontWeight: 600,
                    fontSize: 12,
                    cursor: "pointer",
                    display: "flex",
                    alignItems: "center",
                    gap: 6
                  }}
                >
                  📥 Exportar a Excel
                </button>
              </div>

              {/* GRILLA */}
              {multitabla ? (
                <div style={{display:"flex",flexDirection:"column",gap:24}}>
                  {tablas.map((tbl, idx) => (
                    <div key={idx} className="card" style={{padding:18,background:"#0c0d13",border:"1px solid #2a2d3e",borderRadius:8}}>
                      <h3 style={{fontSize:15,fontWeight:700,color:"#f5a623",marginBottom:14,textTransform:"uppercase",letterSpacing:".05em",borderBottom:"1px solid #1a1c28",paddingBottom:8}}>{tbl.titulo}</h3>
                      <div style={{overflowX:"auto"}}>
                        <table>
                          <thead>
                            <tr>
                              {tbl.columnas.map(col => <th key={col}>{col}</th>)}
                            </tr>
                          </thead>
                          <tbody>
                            {tbl.filas.map((row, fIdx) => (
                              <tr key={fIdx}>
                                {tbl.columnas.map(col => {
                                  const val = row[col];
                                  let renderVal = val !== null && val !== undefined ? String(val) : "—";
                                  
                                  // Formateo de números de Tn o Kg
                                  if (col.toLowerCase().includes("tn") || col.toLowerCase().includes("toneladas") || col.toLowerCase().includes("pactadas") || col.toLowerCase().includes("asignadas") || col.toLowerCase().includes("pendientes") || col.toLowerCase().includes("comprado") || col.toLowerCase().includes("recibir")) {
                                    const n = parseFloat(val);
                                    if (!isNaN(n)) renderVal = n.toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 2});
                                  }
                                  
                                  // Formateo de precios
                                  if (col.toLowerCase().includes("precio") || col.toLowerCase().includes("monto") || col.toLowerCase().includes("tarifa")) {
                                    const n = parseFloat(val);
                                    if (!isNaN(n)) renderVal = `$ ${n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                                  }
                                  
                                  return <td key={col} className={typeof val === "number" ? "mono" : ""}>{renderVal}</td>;
                                })}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{overflowX:"auto"}}>
                  <table>
                    <thead>
                      <tr>
                        <th style={{background:"rgba(52,152,219,.1)",color:"#3498db",fontWeight:600}}>ID Movimiento</th>
                        {columnas.map(col => {
                          if (col.toLowerCase() !== "id") {
                            return <th key={col}>{col}</th>;
                          }
                          return null;
                        })}
                      </tr>
                    </thead>
                    <tbody>
                      {filasFiltradas.map((row, idx) => (
                        <tr key={idx}>
                          <td style={{fontFamily:"'IBM Plex Mono', monospace",fontSize:11,color:"#3498db",fontWeight:600}}>{row.id || row.ID || "—"}</td>
                          {columnas.map(col => {
                            if (col.toLowerCase() !== "id") {
                              const val = row[col];
                              let renderVal = val !== null && val !== undefined ? String(val) : "—";
                              
                              // Formateo de números de kg
                              if (col.toLowerCase().includes("kg") || col.toLowerCase().includes("neto") || col.toLowerCase().includes("tara") || col.toLowerCase().includes("bruto") || col.toLowerCase().includes("liquidable")) {
                                const n = parseFloat(val);
                                if (!isNaN(n)) renderVal = Math.round(n).toLocaleString();
                              }
                              // Formateo de fletes o precios
                              if (col.toLowerCase().includes("precio") || col.toLowerCase().includes("monto") || col.toLowerCase().includes("tarifa")) {
                                const n = parseFloat(val);
                                if (!isNaN(n)) renderVal = `$ ${n.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                              }
                              
                              return <td key={col} className={typeof val === "number" ? "mono" : ""}>{renderVal}</td>;
                            }
                            return null;
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          ) : (
            !cargando && sqlQuery && (
              <div className="card" style={{padding:"30px 20px",textAlign:"center",color:"#565d7a"}}>
                La consulta se ejecutó pero no devolvió filas. Probá ampliando los criterios de búsqueda.
              </div>
            )
          )}
        </div>
      </div>
    </div>
  );
};

const NuevaUbicacionRapida = ({ idContraparte }) => {
  const [nombre, setNombre] = useState("");
  const [localidad, setLocalidad] = useState("");
  const [provincia, setProvincia] = useState("");
  const [direccion, setDireccion] = useState("");
  const [nroPlanta, setNroPlanta] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [listo, setListo] = useState(false);
  const [error, setError] = useState("");

  const guardar = async (e) => {
    e.preventDefault();
    if (!nombre.trim()) { setError("El nombre del destino es obligatorio."); return; }
    setGuardando(true);
    setError("");
    try {
      const r = await fetch(`${API_URL}/api/contrapartes/${idContraparte}/ubicaciones`, {
        method: "POST",
        headers: authHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify({ nombre, localidad, provincia, direccion, nro_planta: nroPlanta })
      });
      const body = await r.json().catch(()=>null);
      if (!r.ok) { setError(body?.error || `Error HTTP ${r.status}`); setGuardando(false); return; }
      setListo(true);
    } catch (err) {
      setError(err.message);
      setGuardando(false);
    }
  };

  if (listo) {
    return (
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0f1117",color:"#e8eaf0",fontFamily:"inherit"}}>
        <div style={{textAlign:"center",padding:30}}>
          <div style={{fontSize:40,marginBottom:10}}>✅</div>
          <h2>Destino guardado y asociado correctamente</h2>
          <p style={{color:"#8890a8"}}>Ya podés cerrar esta pestaña y volver a la carga — usá el botón ↻ para actualizar la lista de destinos.</p>
        </div>
      </div>
    );
  }

  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0f1117",color:"#e8eaf0",fontFamily:"inherit"}}>
      <form onSubmit={guardar} style={{background:"#1a1d26",border:"1px solid #2a2d3e",borderRadius:8,padding:24,width:420}}>
        <h3 style={{marginBottom:16}}>📍 Nuevo destino de entrega</h3>
        {error && <div style={{background:"rgba(231,76,60,.1)",border:"1px solid rgba(231,76,60,.3)",color:"#e74c3c",padding:8,borderRadius:6,marginBottom:12,fontSize:13}}>{error}</div>}
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:"#8890a8",display:"block",marginBottom:4}}>Nombre de la planta / destino *</label>
          <input value={nombre} onChange={e=>setNombre(e.target.value)} placeholder="Ej: Terminal 6 - Puerto San Martín" style={{width:"100%",padding:"8px 10px",background:"#0f1117",border:"1px solid #2a2d3e",color:"#e8eaf0",borderRadius:4}}/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:"#8890a8",display:"block",marginBottom:4}}>Localidad</label>
          <input value={localidad} onChange={e=>setLocalidad(e.target.value)} style={{width:"100%",padding:"8px 10px",background:"#0f1117",border:"1px solid #2a2d3e",color:"#e8eaf0",borderRadius:4}}/>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:"#8890a8",display:"block",marginBottom:4}}>Provincia</label>
          <select value={provincia} onChange={e=>setProvincia(e.target.value)} style={{width:"100%",padding:"8px 10px",background:"#0f1117",border:"1px solid #2a2d3e",color:"#e8eaf0",borderRadius:4}}>
            <option value="">Seleccionar...</option>
            {PROVINCIAS.map(p=><option key={p} value={p}>{p}</option>)}
          </select>
        </div>
        <div style={{marginBottom:12}}>
          <label style={{fontSize:11,color:"#8890a8",display:"block",marginBottom:4}}>Dirección</label>
          <input value={direccion} onChange={e=>setDireccion(e.target.value)} style={{width:"100%",padding:"8px 10px",background:"#0f1117",border:"1px solid #2a2d3e",color:"#e8eaf0",borderRadius:4}}/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:11,color:"#8890a8",display:"block",marginBottom:4}}>N° de Planta</label>
          <input value={nroPlanta} onChange={e=>setNroPlanta(e.target.value)} style={{width:"100%",padding:"8px 10px",background:"#0f1117",border:"1px solid #2a2d3e",color:"#e8eaf0",borderRadius:4}}/>
        </div>
        <Btn type="submit" disabled={guardando} style={{width:"100%"}}>{guardando ? "Guardando..." : "Guardar y asociar"}</Btn>
      </form>
    </div>
  );
};

                onClick={() => setSec("cc")}
                style={{
                  background: sec === "cc" ? "#2980b9" : "#2a2d3e",
                  color: sec === "cc" ? "#fff" : "#8890a8",
                  border: "none",
                  padding: "4px 8px",
                  borderRadius: 5,
                  fontSize: 11,
                  fontWeight: 600,
                  cursor: "pointer",
                  transition: "all 0.2s"
                }}
              >
                🏦 Cta Cte
              </button>
            </div>
          </div>
        </div>
        {render()}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Error atrapado por ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0f1117",color:"#e8eaf0",fontFamily:"inherit",padding:20}}>
          <div style={{textAlign:"center",maxWidth:500}}>
            <div style={{fontSize:40,marginBottom:10}}>⚠️</div>
            <h2>Ocurrió un error inesperado</h2>
            <p style={{color:"#8890a8",marginBottom:16}}>La pantalla se cerró para evitar un estado inconsistente. Recargá la página para seguir — no se perdió nada guardado.</p>
            <button onClick={()=>window.location.reload()} style={{padding:"10px 20px",background:"#f5a623",color:"#000",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700}}>Recargar página</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
