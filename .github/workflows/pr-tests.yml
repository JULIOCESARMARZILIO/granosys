name: PR tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run each Jest suite in an isolated process
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "Running ${test_file}"
            npm test -- --runInBand "${test_file}"
          done < <(find tests -name '*.test.js' -type f | sort)
      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check src/db.js
          node --check src/routes/arca.js
          node --check src/services/arcaOfficialClient.js
          node --check src/services/arcaCertificateExtractor.js
