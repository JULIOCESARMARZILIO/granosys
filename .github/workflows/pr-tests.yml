name: PR tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: |
          node --check src/index.js
          node --check src/db.js
          node --check src/routes/arca.js
          node --check src/services/arcaOfficialClient.js
          node --check src/services/arcaCertificateExtractor.js
